<!-- =============================================================
     SETUP

     1. console.firebase.google.com -> Add project (skip Analytics)
     2. Databases & Storage > Firestore Database -> Create database
        Standard edition / Database ID stays (default) / production mode
     3. Authentication > Get started > Sign-in method > enable Anonymous
     4. Firestore > Rules tab, paste this, Publish:

          rules_version = '2';
          service cloud.firestore {
            match /databases/{database}/documents {
              match /bookclub/{docId} {
                allow read: if request.auth != null;
                allow create, update: if request.auth != null
                                      && request.resource.data.months is list
                                      && request.resource.data.months.size() > 0;
                allow delete: if false;
              }
            }
          }

        Deletion is refused outright, empty writes are rejected, and every
        request needs a token. The site signs in silently, so neither of
        you sees a login screen.

     5. Project settings (gear) > Your apps > Web (</>) -> register
     6. Copy the six values into FIREBASE below

     Each year lives in its own document: bookclub/2026, bookclub/2027...
     The TBR list is not tied to a year, so it has a document of its own:
     bookclub/tbr. (Its "months" field is only there because the rules above
     refuse any document without one; the list itself is in "items".)
     ============================================================= -->

<style>
/* =====================================================================
   HOW THE LOOK IS PUT TOGETHER
   - Colours come from the nine variables on the first two lines below. The script
     overwrites them with this month's theme (or your own colours) as soon as it runs.
   - Three fonts, each with one job: --display for the big condensed headings (site
     title, month names, book titles), --ui for everything you read or press, and
     --quote for quotes.
   ===================================================================== */
:root{
  --bg:#120b18; --fg:#f3ebf7; --card:#efe6d6; --card-fg:#1a1022;
  --accent:#f2761b; --gold:#b98cff; --reader-a:#ff8c3a; --reader-b:#8fe36a; --radius:6px;
  /* text colour to use ON TOP of each of those colours; the script picks dark or white */
  --on-accent:#14100e; --on-gold:#14100e; --on-a:#14100e; --on-b:#14100e;
  /* everything below is worked out from the nine above */
  --bg-2: color-mix(in srgb, var(--bg) 90%, var(--fg));
  --bg-3: color-mix(in srgb, var(--bg) 80%, var(--fg));
  --fg-dim: color-mix(in srgb, var(--fg) 60%, var(--bg));
  --card-dim: color-mix(in srgb, var(--card-fg) 55%, var(--card));
  --rule: color-mix(in srgb, var(--fg) 17%, transparent);
  --veil: color-mix(in srgb, var(--bg) 82%, #000);      /* backdrop behind an open month */
  --r-s: calc(var(--radius) * .5 + 2px);                 /* small corners: covers, buttons, fields */
  --r-l: calc(var(--radius) * 1.5 + 2px);                /* large corners: panels */
  --display:"Big Shoulders Display","Haettenschweiler","Arial Narrow",sans-serif;
  --ui:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --quote:"Literata",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;
  line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  padding-bottom:calc(5rem + env(safe-area-inset-bottom))}
body.locked{overflow:hidden;background:var(--veil)}
/* a sheet is open: the page underneath is hidden, so nothing can peek out below it */
body.locked .wrap{visibility:hidden}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px}
img{display:block;max-width:100%}
[hidden]{display:none!important}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 clamp(1rem,4vw,2.5rem)}

/* ---------- top strip ---------- */
.statusbar{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.25rem;padding:.7rem 0;
  border-bottom:1px solid var(--rule);font-size:.82rem;color:var(--fg-dim)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fg-dim);display:inline-block;
  margin-right:.5rem;vertical-align:middle}
.dot.live{background:#3fbf6b}.dot.saving{background:var(--gold)}.dot.err{background:var(--accent)}
.who-pick{display:flex;gap:.4rem;margin-left:auto;align-items:center;flex-wrap:wrap}
.chip{padding:.3rem .8rem;border:1px solid var(--rule);border-radius:99px;font-size:.82rem;
  font-weight:500;color:var(--fg);transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--fg-dim)}
.chip[aria-pressed=true]{background:var(--c,var(--accent));border-color:var(--c,var(--accent));
  color:var(--oc,var(--on-accent));font-weight:600}

/* ---------- drifting dragonflies ---------- */
.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.sheet-inner{position:relative;z-index:1}
.sky .df{position:absolute;left:0;width:54px;color:var(--gold);opacity:.15;
  will-change:transform;animation:drift 58s linear infinite}
.sky .df ellipse,.sky .df rect,.sky .df path{fill:currentColor}
.sky .df .w{transform-box:view-box;transform-origin:50px 20px;
  animation:hoverwing 2.4s ease-in-out infinite}
.sky .df.a{top:7%}
.sky .df.b{top:27%;width:34px;opacity:.10;animation-duration:82s;animation-delay:-30s}
.sky .df.c{top:49%;width:68px;opacity:.13;animation-duration:47s;animation-delay:-14s}
.sky .df.d{top:68%;width:44px;opacity:.11;animation-duration:71s;animation-delay:-52s}
.sky .df.e{top:86%;width:58px;opacity:.14;animation-duration:63s;animation-delay:-38s}
.sky-sheet .df{opacity:.09}
@keyframes drift{
  0%  {transform:translate3d(-110px,0,0) rotate(6deg)}
  25% {transform:translate3d(28vw,-18px,0) rotate(-5deg)}
  50% {transform:translate3d(54vw,13px,0) rotate(9deg)}
  75% {transform:translate3d(80vw,-10px,0) rotate(-4deg)}
  100%{transform:translate3d(calc(100vw + 110px),0,0) rotate(5deg)}
}
@keyframes hoverwing{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.7)}}

/* ---------- title block ---------- */
.masthead{padding:clamp(1.75rem,5vw,3.5rem) 0 1.75rem}
.eyebrow{display:flex;align-items:center;gap:.6rem;font-size:.9rem;font-weight:600;
  color:var(--gold);margin-bottom:1rem}
.eyebrow .line{flex:1;height:1px;background:var(--rule)}
.yr{border:1px solid var(--rule);border-radius:99px;width:1.8rem;height:1.8rem;
  display:inline-flex;align-items:center;justify-content:center;color:var(--fg);line-height:1}
.yr:hover{border-color:var(--fg-dim)}
.yr[disabled]{opacity:.3;cursor:default}
h1.title{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,9.5vw,6.5rem);
  line-height:.86;letter-spacing:-.01em;text-transform:uppercase;margin:0}
h1.title em{font-style:normal;color:var(--accent)}
.colophon{display:flex;flex-wrap:wrap;gap:.3rem 1.5rem;margin-top:1.4rem;padding-top:1rem;
  border-top:1px solid var(--rule);font-size:.9rem;color:var(--fg-dim)}
.colophon b{color:var(--fg);font-weight:600}

/* ---------- buttons ---------- */
.btn{font-size:.88rem;font-weight:600;line-height:1.2;padding:.6rem 1rem;border:1px solid var(--rule);
  border-radius:var(--r-s);color:var(--fg);transition:background .15s,border-color .15s,color .15s,filter .15s}
.btn:hover{background:var(--bg-2);border-color:var(--fg-dim)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent);filter:brightness(1.1)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.gold:hover{background:var(--gold);filter:brightness(1.08)}
.btn.ghost{border-color:transparent;color:var(--fg-dim)}
.btn.ghost:hover{color:var(--fg)}
.link{color:var(--gold);text-decoration:underline;text-underline-offset:3px;font-size:.88rem;font-weight:500}

/* ---------- the shelf: one cover per month, straight on the page ---------- */
.grid{display:grid;gap:clamp(1.75rem,3.5vw,2.75rem) clamp(1rem,2.5vw,1.75rem);
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));margin-top:.75rem}
.card{position:relative;display:flex;flex-direction:column;justify-content:flex-start;--gap:.7rem;gap:var(--gap);
  width:100%;text-align:left;border-radius:var(--r-s)}
.card-top{display:flex;align-items:center;height:1.5rem;overflow:hidden}
.card-month{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1.45rem;
  line-height:1;letter-spacing:.01em}
/* the badge on the corner of the cover */
.card-kind{position:absolute;z-index:5;left:.5rem;top:calc(1.5rem + var(--gap) + .5rem);
  font-size:.74rem;font-weight:600;line-height:1.3;white-space:nowrap;padding:.16rem .55rem;border-radius:99px;
  color:var(--fg);background:color-mix(in srgb,var(--bg) 74%,transparent);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .2s ease}
.card.is-now .card-kind{background:var(--accent);color:var(--on-accent)}

/* a cover. The cream "blank book" underneath shows when a book has no cover art */
.cover-slot{position:relative;aspect-ratio:2/3;overflow:hidden;border-radius:var(--r-s);background:var(--card);
  box-shadow:0 18px 30px -16px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.25)}
.cover-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover-fallback{position:absolute;inset:0;display:flex;align-items:flex-end;padding:.75rem;
  font-family:var(--display);font-weight:600;text-transform:uppercase;font-size:1rem;line-height:1.05;
  color:var(--card-dim);--vein:color-mix(in srgb,var(--card-fg) 10%,transparent);
  background:
    repeating-linear-gradient(101deg, transparent 0 15px, var(--vein) 15px 15.7px),
    repeating-linear-gradient(7deg, transparent 0 10px, var(--vein) 10px 10.7px)}
.card > .cover-slot,.card > .cover-stack{transition:transform .2s ease}
.card:hover > .cover-slot,.card:hover > .cover-stack,.card:hover > .card-kind,
.card:focus-visible > .cover-slot,.card:focus-visible > .cover-stack,.card:focus-visible > .card-kind{transform:translateY(-5px)}
/* this month gets a ring in the accent colour */
.card.is-now > .cover-slot,.card.is-now > .cover-stack .cover-slot:first-child{
  outline:2px solid var(--accent);outline-offset:3px}
/* a month with nothing picked: an empty outline instead of a cover */
.card.empty > .cover-slot{background:none;box-shadow:none;border:1.5px dashed var(--rule)}
.card.empty .cover-fallback{background:none;align-items:center;justify-content:center;text-align:center;
  font-family:var(--ui);font-weight:500;font-size:.85rem;text-transform:none;color:var(--fg-dim)}

.card-body{display:grid;gap:.8rem}
.cbook{display:grid;gap:.12rem}
.card-title{font-weight:600;font-size:1rem;line-height:1.25;margin:0}
.card-author{font-size:.82rem;color:var(--fg-dim);margin:0}
/* scores under a cover: a coloured number, then whose it is */
.scores{display:flex;flex-wrap:wrap;gap:.05rem .9rem;margin-top:.3rem;font-size:.8rem;color:var(--fg-dim)}
.sc{display:inline-flex;align-items:baseline;gap:.3rem;white-space:nowrap}
.sc b{font-size:.98rem;font-weight:700;color:var(--c,var(--fg));font-variant-numeric:tabular-nums}
.sc.none b{color:var(--fg-dim);opacity:.6;font-weight:500}

/* a month with more than one book: the covers fan out */
.cover-stack{position:relative;aspect-ratio:2/3}
.cover-stack .cover-slot{position:absolute;width:70%;
  box-shadow:0 0 0 3px var(--bg),0 16px 26px -14px rgba(0,0,0,.75)}
.cover-stack .cover-slot:nth-child(1){left:0;top:0;z-index:3}
.cover-stack .cover-slot:nth-child(2){right:0;bottom:0;z-index:2}
.cover-stack.n3 .cover-slot{width:60%}
.cover-stack.n3 .cover-slot:nth-child(2){right:20%;bottom:20%}
.cover-stack.n3 .cover-slot:nth-child(3){right:0;bottom:0;z-index:1}
.cover-stack .cover-fallback{font-size:.8rem;padding:.5rem}
.cover-stack .more{position:absolute;right:.35rem;bottom:.35rem;z-index:4;font-size:.72rem;font-weight:700;
  padding:.1rem .45rem;border-radius:99px;background:var(--fg);color:var(--bg)}

/* ---------- an open month ---------- */
.scrim{position:fixed;inset:0;background:var(--veil);z-index:40;display:none}
.scrim.open{display:block}
.scrim.thin{background:rgba(0,0,0,.35)}      /* behind the Colors panel: see-through, so you can watch the page change */
/* the month's covers, blurred until only their colours are left, strongest at the top
   and fading into the plain backdrop lower down */
.sheet-wash{position:fixed;inset:0;z-index:45;overflow:hidden;pointer-events:none;display:none}
.sheet-wash.on{display:block}
.sheet-wash .imgs{position:absolute;inset:-25% -20% 25% -20%;display:flex;filter:blur(70px) saturate(1.6);opacity:.72}
.sheet-wash img{flex:1;min-width:0;max-width:none;height:100%;object-fit:cover}
.sheet-wash::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,
  color-mix(in srgb,var(--veil) 58%,transparent) 0%,
  color-mix(in srgb,var(--veil) 76%,transparent) 42%,
  var(--veil) 80%)}
.sheet{position:fixed;inset:0;z-index:50;overflow-y:auto;display:none;animation:rise .22s ease-out}
.sheet.open{display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sheet-inner{max-width:960px;margin:0 auto;padding:clamp(.75rem,3vw,2rem) clamp(1rem,4vw,2.5rem) 6rem}
.sheet-bar{position:sticky;top:.6rem;z-index:2;display:flex;align-items:center;justify-content:space-between;
  gap:1rem;padding:.4rem;margin:0 -.4rem 1.75rem;border:1px solid var(--rule);

  -webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
.sheet-month{font-family:var(--display);font-weight:800;text-transform:uppercase;
  font-size:clamp(2.4rem,8vw,4.5rem);line-height:.85;margin:0 0 .4rem}
.section-label{display:flex;align-items:center;gap:.9rem;margin:2.5rem 0 1.25rem;

.bom{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:clamp(1.25rem,4vw,2.5rem);align-items:start}
.bom + .bom{margin-top:2.5rem;padding-top:2.5rem;border-top:1px solid var(--rule)}
.book-title{font-family:var(--display);font-weight:600;text-transform:uppercase;
  font-size:clamp(1.5rem,4vw,2.4rem);line-height:.98;margin:0}
.book-author{font-size:.98rem;color:var(--fg-dim);margin:.5rem 0 0}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.8rem}
.tag{font-size:.78rem;font-weight:500;line-height:1.3;padding:.2rem .65rem;border:1px solid var(--rule);
  border-radius:99px;color:var(--fg-dim)}
.scoreline{display:flex;flex-wrap:wrap;gap:1.75rem;margin:1.5rem 0 0;padding:1rem 0;border-block:1px solid var(--rule)}
.score{display:flex;flex-direction:column;gap:.15rem}
.score .lab{font-size:.82rem;font-weight:600;color:var(--fg-dim)}

.score .val small{font-family:var(--ui);font-size:.8rem;font-weight:400;color:var(--fg-dim);margin-left:.15rem}

.quote .attr{display:block;margin-top:.5rem;font-size:.82rem;font-weight:600;color:var(--qc,var(--accent))}
.quote.empty p{font-family:var(--ui);font-style:normal;font-size:.9rem;color:var(--fg-dim);opacity:.7}
.tops{display:grid;gap:1.5rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.top{display:grid;grid-template-columns:84px minmax(0,1fr);gap:1rem;align-items:start;
  padding-top:1rem;border-top:2px solid var(--qc,var(--accent))}

.field{display:block;margin-bottom:.85rem}

.pick.on{border-color:var(--gold)}
.pick span{display:block;font-size:.64rem;line-height:1.35;padding:.3rem;
  color:var(--fg-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qedit{display:flex;gap:.5rem;align-items:flex-start;margin-bottom:.5rem}
.qedit textarea{flex:1}
.qedit button{margin-top:.15rem}

/* ---------- the row above the shelf: Months / List, Wrapped, More ---------- */
.viewbar{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;margin:0 0 1.5rem;
  font-size:.85rem;color:var(--fg-dim)}
.viewbar > span{margin-right:.3rem}
.viewbar > .grow{flex:1;margin:0}
.menu{position:relative}
.menu > summary{list-style:none;display:inline-flex;align-items:center;gap:.5rem;cursor:pointer;user-select:none}
.menu > summary::-webkit-details-marker{display:none}
.menu > summary::after{content:"";border-left:4px solid transparent;border-right:4px solid transparent;
  border-top:5px solid currentColor;opacity:.7}
.menu[open] > summary{background:var(--bg-2);border-color:var(--fg-dim)}
.menu-list{position:absolute;right:0;top:calc(100% + .4rem);z-index:20;min-width:13rem;padding:.35rem;
  background:var(--bg-2);border:1px solid var(--rule);border-radius:var(--r-l);
  box-shadow:0 18px 40px rgba(0,0,0,.45)}
.menu-list button{display:block;width:100%;text-align:left;padding:.65rem .8rem;border-radius:var(--r-s);
  font-size:.9rem;font-weight:500;color:var(--fg)}
.menu-list button:hover,.menu-list button:focus-visible{background:var(--bg-3)}

/* ---------- TBR ---------- */
.chip .count{display:inline-block;margin-left:.4rem;min-width:1.25rem;padding:0 .35rem;border-radius:99px;
  font-size:.72rem;font-weight:700;line-height:1.25rem;text-align:center;background:var(--bg-3);color:var(--fg)}
.chip[aria-pressed=true] .count{background:color-mix(in srgb,currentColor 22%,transparent);color:inherit}
.menu-list button.only-phone{display:none}
.btn[disabled]{opacity:.4;cursor:default}
.btn.primary[disabled]:hover{filter:none}
.tbr-add{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) minmax(0,.75fr) minmax(0,1.25fr) minmax(0,1.1fr) auto;
  gap:.75rem;align-items:end;padding:1rem;margin-bottom:2rem;border:1px solid var(--rule);
  border-radius:var(--r-l);background:var(--bg-2)}
.tbr-add .field{margin:0}
/* books are grouped by the month they are pencilled in for, in calendar order */
.tbr-group{margin-bottom:2.25rem}
.tbr-month{display:flex;align-items:center;gap:.6rem;margin:0;font-family:var(--display);font-weight:800;
  text-transform:uppercase;font-size:1.45rem;line-height:1.1}
.tbr-month i{flex:none;width:10px;height:10px;border-radius:50%}   /* dot in that month's own colour */
.tbr-month span{color:var(--fg-dim);font-weight:600}
.tbr-note{margin:.2rem 0 0;font-size:.85rem;color:var(--fg-dim)}
.tbr-row,.plan-row{display:grid;gap:.9rem;align-items:center;padding:.75rem 0;border-bottom:1px solid var(--rule)}
.tbr-row{grid-template-columns:52px minmax(0,1fr) minmax(9rem,12rem) auto auto 2.2rem}
.plan-row{grid-template-columns:52px minmax(0,1fr) auto}
.tbr-row .cover-slot,.plan-row .cover-slot{box-shadow:0 8px 16px -10px rgba(0,0,0,.7)}
.tbr-row .cover-fallback,.plan-row .cover-fallback{font-size:0;padding:0}
.tbr-who{display:flex;flex-wrap:wrap;gap:0 .7rem;margin:.15rem 0 0;font-size:.78rem}
.tbr-who b{font-weight:600}
.tbr-who span{color:var(--fg-dim)}
.tbr-edit-btn{padding:.45rem .6rem;border-radius:var(--r-s);font-size:.84rem;font-weight:600;color:var(--fg-dim)}
.tbr-edit-btn:hover,.tbr-edit-btn[aria-expanded=true]{color:var(--fg);background:var(--bg-2)}
.tbr-row.editing{border-bottom-color:transparent}
.tbr-editor{margin:.15rem 0 1.1rem}
.tbr-editor-foot{display:flex;gap:.5rem;margin-top:1rem}
.tbr-del{width:2.2rem;height:2.2rem;border-radius:99px;color:var(--fg-dim);font-size:1.2rem;line-height:1;justify-self:end}
.tbr-del:hover{background:var(--bg-2);color:var(--fg)}
/* first tap on the x turns it into "Remove?"; a second tap removes the book */
.tbr-del.armed{width:auto;padding:0 .7rem;font-size:.8rem;font-weight:600;white-space:nowrap;
  background:var(--accent);color:var(--on-accent)}
/* a month with nothing confirmed, but something on the TBR pencilled in: a faded cover */
.card.planned > .cover-slot,.card.planned > .cover-stack{opacity:.45}
.card.planned .card-title{color:var(--fg-dim)}

/* ---------- reading now ---------- */
.now{position:relative;isolation:isolate;overflow:hidden;margin:0 0 2rem;
  border:1px solid var(--rule);border-radius:var(--r-l);background:var(--bg-2)}
/* the backdrop: this month's cover(s), blurred until only their colours are left... */
.now-wash{position:absolute;inset:-30%;z-index:-1;display:flex;filter:blur(60px) saturate(1.5);opacity:.62}
.now-wash img{flex:1;min-width:0;max-width:none;height:100%;object-fit:cover}
/* ...then toned down with the page colour so the text stays readable in any theme */
.now::after{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(100deg,color-mix(in srgb,var(--bg) 86%,transparent),
    color-mix(in srgb,var(--bg) 70%,transparent))}
.now-in{padding:clamp(1.1rem,3vw,2rem)}
.now-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.2rem;
  font-size:.9rem;font-weight:600}
.now-label{display:inline-flex;align-items:center;gap:.55rem;color:var(--gold)}
.now-label::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.now-month{color:var(--fg);opacity:.75;font-weight:500}
.now-books{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,21rem),1fr));gap:1.75rem 2.5rem}
.now-book{display:grid;grid-template-columns:clamp(92px,15vw,160px) minmax(0,1fr);
  gap:clamp(1rem,2.5vw,1.75rem);align-items:start}
.now-book .cover-fallback{font-size:.8rem;padding:.5rem}
.now-book .scoreline{margin-top:1.1rem;padding:0;border:none;gap:1rem 1.5rem}
.now-book .score .val{font-size:1.8rem}
.now-empty{font-family:var(--display);font-weight:600;text-transform:uppercase;
  font-size:clamp(1.4rem,4vw,2.2rem);line-height:1;margin:0}
.now-foot{display:flex;flex-wrap:wrap;align-items:center;gap:.9rem 1.5rem;margin-top:1.4rem;
  padding-top:1.1rem;border-top:1px solid var(--rule)}
.now-days{flex:1;min-width:12rem;font-size:.85rem;color:var(--fg-dim)}
.now-days .bar{margin:0 0 .55rem;background:color-mix(in srgb,var(--fg) 16%,transparent)}
.now-next{margin:.9rem 0 0;font-size:.88rem;color:var(--fg-dim)}
.now-next b{color:var(--fg);font-weight:600}

/* ---------- list view ---------- */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--rule);
  border-radius:var(--r-l)}
table.books{width:100%;min-width:940px;border-collapse:collapse;font-size:.92rem}
.books th,.books td{border:1px solid var(--rule);padding:.5rem .7rem;text-align:left;vertical-align:middle}
.books tr > :first-child{border-left:none}
.books tr > :last-child{border-right:none}
.books thead tr:first-child th{border-top:none}
.books tbody:last-child tr:last-child td,.books tfoot tr:last-child td{border-bottom:none}
.books thead th{background:var(--bg-2);padding:0;font-weight:600}
.th-btn,.th-plain{font-size:.82rem;font-weight:600;white-space:nowrap}
.th-btn{display:flex;align-items:center;justify-content:space-between;gap:.6rem;width:100%;
  padding:.7rem .7rem;text-align:left}
.books thead th.th-plain{padding:.7rem .7rem}
.th-btn:hover .arrows i{opacity:.8}
.arrows{display:inline-grid;gap:3px;flex:none;color:var(--fg)}
.arrows i{display:block;width:0;height:0;border-left:4px solid transparent;
  border-right:4px solid transparent;opacity:.3}
.arrows .up{border-bottom:6px solid currentColor}
.arrows .dn{border-top:6px solid currentColor}
th[aria-sort=ascending] .arrows .up,th[aria-sort=descending] .arrows .dn{opacity:1;color:var(--gold)}
.books thead .filters th{padding:.4rem .45rem;background:color-mix(in srgb,var(--bg-2) 55%,var(--bg))}
.books .filters input,.books .filters select{padding:.35rem .45rem;font-size:.82rem;min-width:5.5rem}
.books .filters .on{border-color:var(--gold);color:var(--gold)}
.books tbody tr{cursor:pointer;transition:background .12s}
.books tbody tr:hover{background:var(--bg-2)}
.books tbody tr.none{cursor:default;background:none}
.books tbody tr.none td{padding:2rem 1rem;text-align:center;font-size:.9rem;color:var(--fg-dim)}
.books .c-cover{width:66px;padding:.4rem .6rem}
.books .cover-slot{width:46px;height:69px;aspect-ratio:auto;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.books .cover-fallback{font-size:0;padding:0}
.books .lt{font-weight:600;line-height:1.25;margin:0}
.books .la{font-size:.8rem;color:var(--fg-dim);margin:.15rem 0 0}
.books .c-book{min-width:12rem}
.books .c-month{font-size:.88rem;white-space:nowrap}
.books .mabbr{display:none}
.books .num{font-size:.95rem;font-weight:700;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.books .num.none{color:var(--fg-dim);opacity:.5;font-weight:400}
.books .c-type{font-size:.85rem;white-space:nowrap}
.books .c-type small{display:block;font-size:.76rem;margin-top:.1rem;color:var(--fg-dim)}
.books .c-genres{font-size:.8rem;color:var(--fg-dim);line-height:1.45;min-width:8rem}
.books tfoot td{background:var(--bg-2);font-size:.82rem;color:var(--fg-dim)}
.books tfoot td.num{font-size:.95rem;color:var(--fg)}
.list-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem 1rem;
  margin-top:.9rem;font-size:.88rem;color:var(--fg-dim)}

/* ---------- wrapped ---------- */
.big-grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.bignum{border:1px solid var(--rule);border-radius:var(--r-l);padding:1.1rem}
.bignum .n{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,6vw,3.4rem);
  line-height:.9;display:block;color:var(--gold)}
.bignum .l{font-size:.85rem;color:var(--fg-dim);display:block;margin-top:.5rem}
.duel{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.duel-card{border:1px solid var(--rule);border-radius:var(--r-l);padding:1.1rem}
.duel-card h5{font-size:.88rem;font-weight:600;color:var(--gold);margin:0 0 .7rem}
.duel-card .bt{font-family:var(--display);font-weight:600;text-transform:uppercase;font-size:1.35rem;
  line-height:1;margin:0 0 .6rem}
.duel-row{display:flex;justify-content:space-between;gap:1rem;font-size:.9rem;
  padding:.3rem 0;border-bottom:1px solid var(--rule)}
.duel-row:last-child{border-bottom:none}
.bar{height:6px;border-radius:99px;background:var(--bg-2);overflow:hidden;margin-top:.3rem}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.genre-row{display:flex;align-items:center;gap:.8rem;padding:.45rem 0;border-bottom:1px solid var(--rule);
  font-size:.9rem}
.genre-row .gn{flex:1}
.genre-row .gc{color:var(--fg-dim)}

/* ---------- colors panel ---------- */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(390px,100%);z-index:60;background:var(--bg);
  border-left:1px solid var(--rule);overflow-y:auto;padding:1.5rem 1.5rem 4rem;
  transform:translateX(101%);transition:transform .24s ease}
.panel.open{transform:none;box-shadow:-24px 0 60px rgba(0,0,0,.45)}
.panel h3{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1.8rem;margin:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem}
.panel-sub{font-size:.85rem;font-weight:600;color:var(--fg-dim);margin:1.6rem 0 .6rem}
/* the on/off switch for "change with the month" */
.switch{display:flex;align-items:center;gap:.75rem;font-size:1rem;font-weight:600;cursor:pointer}
.switch input{-webkit-appearance:none;appearance:none;flex:none;margin:0;width:44px;height:26px;border-radius:99px;
  background:var(--bg-3);border:1px solid var(--rule);position:relative;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:var(--fg);transition:transform .15s}
.switch input:checked{background:var(--accent);border-color:var(--accent)}
.switch input:checked::after{transform:translateX(18px);background:var(--on-accent)}
.panel-now{font-size:.88rem;line-height:1.5;color:var(--fg-dim);margin:.6rem 0 0}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:.5rem}
.preset{border:1px solid var(--rule);border-radius:var(--r-s);padding:.55rem;text-align:left;
  font-size:.85rem;font-weight:600;line-height:1.3}
.preset small{display:block;font-size:.76rem;font-weight:400;color:var(--fg-dim)}
.preset:hover{border-color:var(--fg-dim)}
.preset[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.swatches{display:flex;gap:3px;margin-bottom:.45rem}
.swatches i{width:14px;height:14px;border-radius:50%;display:block;border:1px solid rgba(128,128,128,.4)}
.color-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.5rem 0;
  border-bottom:1px solid var(--rule)}
.color-row label{font-size:.9rem;color:var(--fg-dim)}
.color-row input[type=color]{width:44px;height:28px;padding:0;border:1px solid var(--rule);
  border-radius:var(--r-s);background:none;cursor:pointer}
.panel-note{font-size:.85rem;line-height:1.55;color:var(--fg-dim);
  margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--rule)}

.toast{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom));
  transform:translate(-50%,1rem);opacity:0;visibility:hidden;pointer-events:none;z-index:80;
  background:var(--gold);color:var(--on-gold);padding:.6rem 1.1rem;border-radius:99px;
  font-size:.88rem;font-weight:600;
  transition:transform .25s ease,opacity .25s ease,visibility 0s linear .25s;
  max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition-delay:0s}

/* ---------- phones ---------- */
@media (max-width:640px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:1.6rem .9rem}
  .card{--gap:.55rem}
  .card-month{font-size:1.2rem}
  .card-kind{font-size:.68rem;left:.4rem;top:calc(1.5rem + var(--gap) + .4rem)}
  .card-title{font-size:.9rem}
  .card-author{font-size:.76rem}
  .scores{font-size:.74rem;gap:.05rem .7rem}
  .sc b{font-size:.9rem}
  .cover-stack .cover-fallback{font-size:.65rem;padding:.35rem}

  .btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;
    text-align:center;padding:.55rem .85rem}
  .chip{min-height:38px;display:inline-flex;align-items:center;padding:.3rem .85rem}
  .yr{width:40px;height:40px;font-size:1.1rem}
  .who-pick{margin-left:0;width:100%}
  .viewbar > span:first-child{display:none}
  #btn-wrapped{display:none}
  .menu-list button.only-phone{display:block}
  .tbr-add{grid-template-columns:1fr 1fr;padding:.85rem}
  .tbr-add .field:first-child,.tbr-add .btn{grid-column:1 / -1}
  /* a TBR row on a phone: cover on the left, title on top, month + Add book underneath */
  .tbr-row{grid-template-columns:46px minmax(0,1fr) auto 2.2rem;gap:.5rem .6rem}
  .tbr-row .cover-slot{grid-column:1;grid-row:1 / 3;align-self:start}
  .tbr-row .tbr-book{grid-column:2;grid-row:1}
  .tbr-row .tbr-edit-btn{grid-column:3;grid-row:1;justify-self:end}
  .tbr-row .tbr-del{grid-column:4;grid-row:1}
  .tbr-row .tbr-plan{grid-column:2;grid-row:2}
  .tbr-row [data-tbr-add]{grid-column:3 / 5;grid-row:2}
  .tbr-editor-foot .btn{flex:1}
  .plan-row{grid-template-columns:46px minmax(0,1fr) auto;gap:.7rem}
  .now-book .score .val{font-size:1.5rem}
  .now-foot .btn{width:100%}

  .masthead{padding:1.5rem 0 1.25rem}
  .colophon{gap:.2rem 1rem;font-size:.85rem}

  .sheet-inner{padding:.5rem 1rem 5rem}
  .sheet-bar{margin-bottom:1.25rem}
  .bom{grid-template-columns:1fr;gap:1.25rem}
  .bom .cover-slot{max-width:160px}
  .section-label{margin:2rem 0 1rem}
  .scoreline{gap:1.1rem;margin-top:1.1rem}
  .score .val{font-size:1.6rem}
  .quote p{font-size:.98rem}
  .top{grid-template-columns:64px minmax(0,1fr);gap:.8rem}
  .row{grid-template-columns:1fr 1fr}
  .cover-row .field{min-width:100%}
  .cover-row .btn{flex:1}

  /* 16px stops iOS zooming the page when a field is focused */
  input[type=text],input[type=number],input[type=url],textarea,select,
  .books .filters input,.books .filters select{font-size:16px}
  /* list view on a phone: tighten everything so cover, title, month and both
     scores fit on screen; the remaining columns scroll sideways inside the box */
  table.books{min-width:0;font-size:.86rem}
  .books th,.books td{padding:.4rem .45rem}
  .th-btn,.th-plain{font-size:.74rem}
  .th-btn,.books thead th.th-plain{padding:.6rem .4rem}
  .th-btn{gap:.3rem}
  .books .c-cover{width:auto;padding:.35rem .4rem}
  .books .cover-slot{width:34px;height:51px}
  .books .c-book{min-width:7rem}
  .books .lt{font-size:.86rem}
  .books .la{font-size:.74rem}
  .books thead .filters th{padding:.3rem .25rem}
  .books .filters input,.books .filters select{min-width:0;padding:.3rem .25rem}
  .books .filters select{-webkit-appearance:none;appearance:none;padding-right:14px;
    background-image:linear-gradient(45deg,transparent 50%,var(--fg-dim) 50%),
      linear-gradient(135deg,var(--fg-dim) 50%,transparent 50%);
    background-size:4px 4px;background-repeat:no-repeat;
    background-position:right 7px top 54%,right 3px top 54%}
  .books th[data-col="month"],.books th[data-col^="s:"]{min-width:4rem}
  .books .mfull{display:none}
  .books .mabbr{display:inline}
  .books .c-type,.books .c-genres{white-space:nowrap;min-width:0}

  .big-grid{grid-template-columns:1fr 1fr;gap:.7rem}
  .bignum{padding:.85rem}
  .duel{grid-template-columns:1fr}
  .picks-grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
  .panel{padding:1.25rem 1.25rem calc(3rem + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;
  transition-duration:.01ms!important}
  .card:hover > .cover-slot,.card:hover > .cover-stack,.card:hover > .card-kind{transform:none}
  .sky .df,.sky .df .w{animation:none!important}
  .sky .df.a{transform:translate3d(8vw,0,0)}
  .sky .df.b{transform:translate3d(34vw,0,0)}
  .sky .df.c{transform:translate3d(58vw,0,0)}
  .sky .df.d{transform:translate3d(20vw,0,0)}
  .sky .df.e{transform:translate3d(74vw,0,0)}}
</style>

<script>
/* ================= constants ================= */
const SEED = JSON.parse(document.getElementById('seed').textContent);
const MONTHS = ['January','February','March','April','May','June','July',
                'August','September','October','November','December'];
const MONTH_NO = {}; MONTHS.forEach((n,i)=>MONTH_NO[n.toLowerCase()]=i+1);
const ZODIAC = ['Rat','Ox','Tiger','Rabbit','Dragon','Snake','Horse','Goat','Monkey','Rooster','Dog','Pig'];
const zodiacFor = y => ZODIAC[(((Number(y)-4)%12)+12)%12];

const THEME_KEYS = [['--bg','Page'],['--fg','Text'],['--card','Blank cover'],['--card-fg','Blank cover text'],
  ['--accent','Accent'],['--gold','Highlight'],['--reader-a','Reader 1'],['--reader-b','Reader 2']];
const PRESETS = {
  'Lacquer':  {'--bg':'#16100e','--fg':'#f0e6d6','--card':'#efe3d0','--card-fg':'#1a1310','--accent':'#d6291e','--gold':'#e5a93c','--reader-a':'#d6291e','--reader-b':'#2e7d64','--radius':'2px'},
  'Newsprint':{'--bg':'#e5e0d5','--fg':'#191713','--card':'#fffdf6','--card-fg':'#191713','--accent':'#a92a1c','--gold':'#7a6a3c','--reader-a':'#a92a1c','--reader-b':'#26584a','--radius':'0px'},
  'Midnight': {'--bg':'#0d1220','--fg':'#e7ecf6','--card':'#e9ecf4','--card-fg':'#141a28','--accent':'#6c5ce7','--gold':'#f2c14e','--reader-a':'#6c5ce7','--reader-b':'#2fb8a8','--radius':'8px'},
  'Bramble':  {'--bg':'#1a0f18','--fg':'#f8e9f0','--card':'#fbedf3','--card-fg':'#25121d','--accent':'#e23e77','--gold':'#f0b45e','--reader-a':'#e23e77','--reader-b':'#8b6bd9','--radius':'12px'},
  'Jade':     {'--bg':'#0e1a16','--fg':'#e9efe6','--card':'#f0eee0','--card-fg':'#131a15','--accent':'#c6402f','--gold':'#d9b65f','--reader-a':'#c6402f','--reader-b':'#3f8f76','--radius':'2px'},
  'Dragonfly':{'--bg':'#0d1b1a','--fg':'#e6f0ea','--card':'#e9efe8','--card-fg':'#0f1c1a','--accent':'#1f9c7a','--gold':'#e0a33a','--reader-a':'#e0653f','--reader-b':'#3d7fd6','--radius':'10px'}
};

/* One set of colours per calendar month, January first. The page uses the one for today's
   month unless "Change with the month" is switched off in the Colors panel. To restyle a
   month, change its colours here: bg = page, fg = text, card = blank-cover colour,
   accent = buttons, gold = highlights, reader-a / reader-b = each of you. */
const MONTH_THEMES = [
  { name:'Winter',    colors:{'--bg':'#0b1622','--fg':'#e8f1f8','--card':'#dfe9f1','--card-fg':'#12202d','--accent':'#3d8fd6','--gold':'#b9e2f4','--reader-a':'#7cc4f0','--reader-b':'#c9a4f2','--radius':'10px'} },
  { name:'Valentine', colors:{'--bg':'#1c0d14','--fg':'#fbe9ef','--card':'#fbe4ea','--card-fg':'#2a111a','--accent':'#e0456f','--gold':'#f5a8bd','--reader-a':'#ff7b93','--reader-b':'#c79bf5','--radius':'14px'} },
  { name:'Clover',    colors:{'--bg':'#0c1a12','--fg':'#e9f4ea','--card':'#e6f1e4','--card-fg':'#102016','--accent':'#2fa55a','--gold':'#e8c552','--reader-a':'#63d08a','--reader-b':'#f0c24e','--radius':'8px'} },
  { name:'Blossom',   colors:{'--bg':'#151424','--fg':'#f1ecf7','--card':'#f0e9f5','--card-fg':'#1c1830','--accent':'#b78be6','--gold':'#f4b6cf','--reader-a':'#f08fb4','--reader-b':'#8fb4f0','--radius':'14px'} },
  { name:'Garden',    colors:{'--bg':'#10201a','--fg':'#edf5e6','--card':'#edf2df','--card-fg':'#14211a','--accent':'#e86a8f','--gold':'#f2d15c','--reader-a':'#f28aa6','--reader-b':'#7fd0a0','--radius':'12px'} },
  { name:'Seaside',   colors:{'--bg':'#071b26','--fg':'#e6f4f7','--card':'#e3f1f2','--card-fg':'#0c2330','--accent':'#19a7b8','--gold':'#f7d45a','--reader-a':'#ffa36b','--reader-b':'#4fd2dd','--radius':'12px'} },
  { name:'Sunset',    colors:{'--bg':'#1a1024','--fg':'#fbeee6','--card':'#fbe8dc','--card-fg':'#261433','--accent':'#f0603f','--gold':'#ffb648','--reader-a':'#ff7d5c','--reader-b':'#7fb0ff','--radius':'10px'} },
  { name:'Sunflower', colors:{'--bg':'#16170d','--fg':'#f6f0dc','--card':'#f5ecd2','--card-fg':'#20200f','--accent':'#e09a1f','--gold':'#f2cf63','--reader-a':'#f08a3c','--reader-b':'#9fcf78','--radius':'8px'} },
  { name:'Harvest',   colors:{'--bg':'#1a120e','--fg':'#f5eadb','--card':'#f1e4cf','--card-fg':'#23160f','--accent':'#c4412f','--gold':'#e0b659','--reader-a':'#f0745a','--reader-b':'#a9c873','--radius':'6px'} },
  { name:'Halloween', colors:{'--bg':'#120b18','--fg':'#f3ebf7','--card':'#efe6d6','--card-fg':'#1a1022','--accent':'#f2761b','--gold':'#b98cff','--reader-a':'#ff8c3a','--reader-b':'#8fe36a','--radius':'4px'} },
  { name:'Fall',      colors:{'--bg':'#1b1109','--fg':'#f6ead9','--card':'#f2e3cb','--card-fg':'#24160c','--accent':'#bd4c17','--gold':'#e3a83a','--reader-a':'#f08a45','--reader-b':'#a8ba74','--radius':'6px'} },
  { name:'Christmas', colors:{'--bg':'#0b1a14','--fg':'#f4efe2','--card':'#f3ecdc','--card-fg':'#10231b','--accent':'#d12d38','--gold':'#e2b84a','--reader-a':'#f2605c','--reader-b':'#5fc893','--radius':'8px'} }
];

/* ================= state ================= */
let DATA = null;
let YEAR = Number(window.START_YEAR) || 2026;
let view = null;              // null | 'month' | 'wrapped'
let openMonth = null, editing = false, me = null;
let FB = null, docRef = null, unsub = null, saveTimer = null;
const LOCAL = {};             // year -> data, used when Firebase is off

const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const member = id => DATA.members.find(m=>m.id===id) || {id:id,name:id,emoji:''};
const memberLabel = id => { const m=member(id); return m.name + (m.emoji ? ' '+m.emoji : ''); };
const readerColor = id => DATA.members.findIndex(m=>m.id===id)===1 ? 'var(--reader-b)' : 'var(--reader-a)';
// Who chose a book is stored as a reader's id, as 'mutual' (you both did), or as '' (not recorded).
// These three turn that into the words, the colour and the dropdown choices used everywhere.
const MUTUAL = 'mutual';
const pickLabel = id => id===MUTUAL ? 'Mutual pick'
  : (id && DATA.members.some(m=>m.id===id)) ? member(id).name+"'s pick" : '';
const pickColor = id => id===MUTUAL ? 'var(--gold)' : readerColor(id);
const pickOptions = (current, blankLabel) =>
  (blankLabel ? '<option value="">'+esc(blankLabel)+'</option>' : '')+
  '<option value="'+MUTUAL+'"'+(current===MUTUAL?' selected':'')+'>Mutual</option>'+
  DATA.members.map(x=>'<option value="'+esc(x.id)+'"'+(current===x.id?' selected':'')+'>'+
    esc(memberLabel(x.id))+'</option>').join('');
// the text colour that is readable on top of that reader's colour
const readerOn = id => DATA.members.findIndex(m=>m.id===id)===1 ? 'var(--on-b)' : 'var(--on-a)';
const fmtScore = n => (n===''||n==null||isNaN(n)) ? null : (Math.round(Number(n)*100)/100).toString();
const num = n => (n==null||n===''||isNaN(n)) ? null : Number(n);

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2400);
}
function setStatus(kind,text){ $('#status').innerHTML='<span class="dot '+kind+'"></span>'+esc(text); }

/* ================= data shape ================= */
function blankYear(y, from){
  const base = from || SEED;
  return {
    club: { name: base.club.name, year: String(y), zodiac: 'Year of the '+zodiacFor(y) },
    members: JSON.parse(JSON.stringify(base.members)),
    theme: Object.assign({}, base.theme),
    themeMode: base.themeMode==='fixed' ? 'fixed' : 'auto',
    meta: { updatedBy:'', updatedAt:'' },
    backlog: [],
    months: MONTHS.map(n=>({ id:n.toLowerCase(), name:n, boms:[], top:[] }))
  };
}

/* A shared book ("read together"). A month keeps a LIST of these in m.boms,
   so one month can hold one book, two, or as many as you got through. */
function newBom(init){
  return Object.assign({ title:'', author:'', goodreads:null, cover:'', pages:null, genres:[],
    pickedBy:'', scores:{}, quotes:Object.fromEntries(DATA.members.map(x=>[x.id,[]])) }, init||{});
}
const bookKey = b => (String(b.title||'')+'|'+String(b.author||'')).trim().toLowerCase();
function tidyBom(b, members){
  b.title = b.title || '';
  b.author = b.author || '';
  b.cover = b.cover || '';
  b.pages = num(b.pages);
  b.genres = cleanGenres(Array.isArray(b.genres) ? b.genres : []);
  b.scores = b.scores || {};
  b.pickedBy = b.pickedBy || '';
  const q = b.quotes || {};
  b.quotes = {};
  members.forEach(x=>{
    const v = q[x.id];
    b.quotes[x.id] = Array.isArray(v) ? v.filter(Boolean) : (v ? [v] : []);
  });
  return b;
}

/* upgrades old documents in place: single quotes -> arrays, missing fields,
   one book of the month (m.bom) -> a list of them (m.boms) */
function migrate(d){
  if (!d) return d;
  d.club = d.club || {name:'Book Club', year:String(YEAR), zodiac:'Year of the '+zodiacFor(YEAR)};
  if (!d.club.zodiac) d.club.zodiac = 'Year of the '+zodiacFor(d.club.year||YEAR);
  d.members = d.members || JSON.parse(JSON.stringify(SEED.members));
  d.members.forEach(m=>{ if (m.emoji==null) m.emoji=''; });
  d.theme = Object.assign({}, PRESETS.Lacquer, d.theme||{});
  // 'auto' = colours follow the calendar month (the default); 'fixed' = stay on d.theme
  d.themeMode = d.themeMode==='fixed' ? 'fixed' : 'auto';
  d.meta = d.meta || {updatedBy:'',updatedAt:''};
  d.backlog = Array.isArray(d.backlog) ? d.backlog : [];
  d.backlog.forEach(b=>{ b.title=b.title||''; b.author=b.author||''; b.addedBy=b.addedBy||''; });
  d.months = d.months || [];
  d.months.forEach(m=>{
    m.top = Array.isArray(m.top) ? m.top : [];
    // Older saves, old backups and the seed above store a single book in m.bom.
    // Fold it into the list, then drop the old field so there is one source of truth.
    const list = Array.isArray(m.boms) ? m.boms.filter(b=>b && typeof b==='object') : [];
    if (m.bom && typeof m.bom==='object' && !list.some(b=>bookKey(b)===bookKey(m.bom))) list.push(m.bom);
    delete m.bom;
    m.boms = list.map(b=>tidyBom(b, d.members));
    m.top.forEach(b=>{
      b.cover = b.cover || '';
      b.pages = num(b.pages);
      b.genres = cleanGenres(Array.isArray(b.genres) ? b.genres : []);
      if (b.quote !== undefined){
        if (!Array.isArray(b.quotes)) b.quotes = b.quote ? [b.quote] : [];
        delete b.quote;
      }
      if (!Array.isArray(b.quotes)) b.quotes = [];
      b.quotes = b.quotes.filter(Boolean);
    });
  });
  return d;
}

function allBooks(d){
  const src = d || DATA, out = [];
  (src.months||[]).forEach(m=>{
    (m.boms || (m.bom ? [m.bom] : [])).forEach(b=>out.push(b));
    (m.top||[]).forEach(b=>out.push(b));
  });
  return out;
}

/* ================= sync ================= */
async function initSync(){
  const cfg = window.FIREBASE || {};
  if (!cfg.projectId){
    setStatus('', 'Not syncing — add your Firebase keys');
    LOCAL[YEAR] = migrate(JSON.parse(JSON.stringify(SEED)));
    DATA = LOCAL[YEAR];
    afterLoad();
    return;
  }
  setStatus('saving','Connecting');
  try {
    const V='https://www.gstatic.com/firebasejs/10.12.2/';
    const [app, fs, authMod] = await Promise.all([
      import(V+'firebase-app.js'),
      import(V+'firebase-firestore.js'),
      import(V+'firebase-auth.js')
    ]);
    const application = app.initializeApp(cfg);

    // Silent sign-in. Nobody sees a login screen; it just gives the browser a
    // token so the security rules can require one. If the Anonymous provider
    // isn't switched on in the Firebase console, this is where it fails.
    try {
      const a = authMod.getAuth(application);
      if (!a.currentUser) await authMod.signInAnonymously(a);
    } catch(err){
      console.warn('Anonymous sign-in failed:', err);
      setStatus('err','Turn on Anonymous sign-in in Firebase Authentication');
    }

    FB = { fs: fs, db: fs.getFirestore(application) };
    await loadYear(YEAR);
    watchTbr();
  } catch(e){
    setStatus('err','Could not reach Firebase — edits stay on this device');
    LOCAL[YEAR] = migrate(JSON.parse(JSON.stringify(SEED)));
    DATA = LOCAL[YEAR];
    afterLoad();
  }
}

async function loadYear(y){
  YEAR = Number(y);
  if (!FB){
    if (!LOCAL[YEAR]) LOCAL[YEAR] = migrate(blankYear(YEAR, DATA || SEED));
    DATA = LOCAL[YEAR];
    afterLoad();
    return;
  }
  if (unsub){ unsub(); unsub = null; }
  setStatus('saving','Loading '+YEAR);
  const fs = FB.fs;
  docRef = fs.doc(FB.db, window.COLLECTION, String(YEAR));
  try {
    const snap = await fs.getDoc(docRef);
    if (!snap.exists()){
      const fresh = (String(YEAR) === String(window.START_YEAR))
        ? migrate(JSON.parse(JSON.stringify(SEED)))
        : migrate(blankYear(YEAR, DATA || SEED));
      fresh.club.year = String(YEAR);
      await fs.setDoc(docRef, fresh);
      DATA = fresh;
    } else {
      DATA = migrate(snap.data());
    }
    afterLoad();
    unsub = fs.onSnapshot(docRef, s=>{
      if (!s.exists() || s.metadata.hasPendingWrites) return;
      if (editing) return;
      const next = s.data();
      if (!next || !next.months) return;
      DATA = migrate(next);
      applyTheme(); syncPanelInputs(); render();
      if (view) renderSheet();
      setStatus('live','All changes saved'); paintLastEdit();
    }, ()=>setStatus('err','Lost connection'));
    setStatus('live','All changes saved');
  } catch(e){
    setStatus('err','Could not load '+YEAR);
  }
}

function afterLoad(){
  applyTheme(); buildPanel(); syncPanelInputs(); buildWhoPicker(); render();
  enrichBooks();
}

async function saveNow(){
  if (!FB || !docRef) return;
  DATA.meta = { updatedBy: me||'', updatedAt: new Date().toISOString() };
  setStatus('saving','Saving');
  try { await FB.fs.setDoc(docRef, DATA); setStatus('live','All changes saved'); paintLastEdit(); }
  catch(e){ setStatus('err','Save failed — check your connection'); }
}
function queueSave(){
  if (!FB) return;
  clearTimeout(saveTimer);
  setStatus('saving','Saving');
  saveTimer = setTimeout(saveNow, 700);
}

function paintLastEdit(){
  const m = DATA.meta || {};
  if (!m.updatedAt){ $('#lastedit').textContent=''; return; }
  const who = m.updatedBy ? member(m.updatedBy).name : 'someone';
  const when = new Date(m.updatedAt), mins = Math.round((Date.now()-when)/60000);
  const ago = mins<1 ? 'just now' : mins<60 ? mins+' min ago'
    : mins<1440 ? Math.round(mins/60)+' hr ago'
    : when.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  $('#lastedit').textContent = 'Last edit by '+who+' · '+ago;
}
