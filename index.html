/* ================= book lookup ================= */
const lookupCache = new Map();
/* The book lookup returns library "subjects", and plenty of those are not genres at all:
   bestseller-list codes, reading levels, "Large type books" and so on. This keeps the
   real ones, tidies their spelling, and returns at most three. */
const GENRE_GENERIC = new Set(['fiction','general','nonfiction','non-fiction','juvenile fiction',
  'young adult fiction','literary','literature','novel','novels','books','stories','adult']);
const GENRE_JUNK = new RegExp([
  '[:=_\\d()\\[\\]]',                       // codes like nyt:combined-print...=2021-10-03
  'best\\s?sell', 'new york times', '\\bnyt\\b', 'award', 'staff pick',
  'reading level', 'large (type|print)', 'accessible book', 'protected daisy', 'in library',
  'open library', 'internet archive', 'overdrive', 'lending', 'collection', 'long now',
  'open syllabus', 'textbook', 'study guide', 'specimen', 'criticism', 'translat', 'e-?book',
  'fiction in\\b',                          // "Fiction in English"
  '^(english|american|british|irish|scottish|canadian|australian|french|german|russian)\\b.*(literature|fiction|language)$'
].join('|'), 'i');
const GENRE_ALIAS = { 'dystopias':'Dystopian', 'love stories':'Romance', 'sci-fi':'Science Fiction' };
function prettyGenre(t){
  const low = t.toLowerCase().replace(/\s+/g,' ')
    // "Fantasy fiction" and "Fantasy" are the same shelf
    .replace(/^(fantasy|romance|horror|mystery|dystopian|suspense|thriller|adventure|gothic|crime)\s+fiction$/, '$1');
  if (GENRE_ALIAS[low]) return GENRE_ALIAS[low];
  return low.replace(/(^|[\s-])([a-z])/g, (m,a,b)=>a+b.toUpperCase())
            .replace(/\s(And|Of|The|In|For|To)\s/g, m=>m.toLowerCase());
}
function cleanGenres(cats){
  const out = [];
  (cats||[]).forEach(c=>String(c).split(/\s*(?:\/|,|;|--)\s*/).forEach(p=>{
    const t = p.trim();
    if (!t || t.length>28 || GENRE_JUNK.test(t) || GENRE_GENERIC.has(t.toLowerCase())) return;
    const nice = prettyGenre(t);
    if (!out.some(x=>x.toLowerCase()===nice.toLowerCase())) out.push(nice);
  }));
  return out.slice(0,3);
}
async function lookupBook(title, author){
  if (!title) return {covers:[],pages:null,genres:[]};
  const key = (title+'|'+(author||'')).toLowerCase();
  if (lookupCache.has(key)) return lookupCache.get(key);
  const q = encodeURIComponent([title,author].filter(Boolean).join(' '));
  const res = { covers:[], pages:null, genres:[] };
  const addCover = (u,l)=>{ if(u && !res.covers.some(c=>c.url===u)) res.covers.push({url:u,label:l||''}); };
  try {
    const j = await (await fetch('https://www.googleapis.com/books/v1/volumes?q='+q+'&maxResults=12&printType=books')).json();
    (j.items||[]).forEach(it=>{
      const vi = it.volumeInfo||{}, l = vi.imageLinks;
      if (l) addCover((l.thumbnail||l.smallThumbnail||'').replace(/^http:/,'https:')
        .replace('&edge=curl','').replace('zoom=1','zoom=3'),
        [vi.publisher||vi.title,(vi.publishedDate||'').slice(0,4)].filter(Boolean).join(' · '));
      if (!res.pages && vi.pageCount) res.pages = vi.pageCount;
      if (!res.genres.length && vi.categories) res.genres = cleanGenres(vi.categories);
    });
  } catch(e){}
  try {
    const j = await (await fetch('https://openlibrary.org/search.json?q='+q+
      '&limit=12&fields=cover_i,title,first_publish_year,number_of_pages_median,subject')).json();
    (j.docs||[]).forEach(d=>{
      if (d.cover_i) addCover('https://covers.openlibrary.org/b/id/'+d.cover_i+'-L.jpg',
        [d.title,d.first_publish_year].filter(Boolean).join(' · '));
      if (!res.pages && d.number_of_pages_median) res.pages = d.number_of_pages_median;
      if (!res.genres.length && d.subject) res.genres = cleanGenres(d.subject.slice(0,30));
    });
  } catch(e){}
  res.covers = res.covers.slice(0,12);
  lookupCache.set(key,res);
  return res;
}

async function enrichBooks(opts){
  const announce = opts && opts.announce;
  const tbrItems = TBR.items.slice();
  const todo = allBooks().concat(tbrItems).filter(b=>b.title && (!b.cover || b.pages==null || !b.genres.length));
  if (!todo.length){ if(announce) toast('Every book already has cover, pages and genres'); return; }
  if (announce) toast('Looking up '+todo.length+' book'+(todo.length>1?'s':'')+'…');
  let changed = 0, tbrChanged = false;
  for (const b of todo){
    const info = await lookupBook(b.title, b.author);
    let hit = false;
    if (!b.cover && info.covers.length){ b.cover = info.covers[0].url; hit = true; }
    if (b.pages==null && info.pages){ b.pages = info.pages; hit = true; }
    if (!b.genres.length && info.genres.length){ b.genres = info.genres; hit = true; }
    if (hit){ changed++; if (tbrItems.includes(b)) tbrChanged = true; render(); if (view) renderSheet(); }
  }
  if (changed) queueSave();
  if (tbrChanged) saveTbr();
  if (announce) toast(changed ? 'Filled in '+changed+' book'+(changed>1?'s':'') : 'Nothing new found');
}

/* ================= TBR (to be read) ================= */
// Books you might read. Each one can be pencilled in for a month ("2026-10", "2027-02" ...).
// Pressing "Add book" on a row is the confirmation: the book moves out of this list and into
// that month as a book you are reading together.
let TBR = { items: [] };
let tbrRef = null;                         // where the list is saved (bookclub/tbr)
const tbrBusy = new Set();                 // rows whose "Add book" is still saving (stops double taps)

const planKey   = (year, monthNo) => year+'-'+String(monthNo).padStart(2,'0');
const planParts = key => {
  const m = /^(\d{4})-(\d{2})$/.exec(key||'');
  return m && Number(m[2])>=1 && Number(m[2])<=12 ? { year:Number(m[1]), no:Number(m[2]) } : null;
};
const planLabel  = key => { const p = planParts(key); return p ? MONTHS[p.no-1]+' '+p.year : 'No month yet'; };
const plannedFor = (year, monthNo) => TBR.items.filter(t=>t.plan===planKey(year, monthNo));
const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

// whatever comes back from storage, make sure every item has every field
function tidyTbr(d){
  const items = d && Array.isArray(d.items) ? d.items : [];
  return { items: items.filter(t=>t && t.title).map(t=>({
    id: String(t.id || newId()),
    title: String(t.title), author: String(t.author||''),
    addedBy: String(t.addedBy||MUTUAL),          // older entries saved as "nobody in particular" count as mutual
    plan: planParts(t.plan) ? t.plan : '',
    cover: String(t.cover||''), pages: num(t.pages),
    genres: cleanGenres(Array.isArray(t.genres) ? t.genres : []),
    addedAt: String(t.addedAt||'')
  })) };
}

// keep the list in step with the other person: whenever the saved copy changes, redraw
function watchTbr(){
  if (!FB) return;
  tbrRef = FB.fs.doc(FB.db, window.COLLECTION, 'tbr');
  FB.fs.onSnapshot(tbrRef, snap=>{
    if (snap.metadata.hasPendingWrites) return;
    TBR = tidyTbr(snap.exists() ? snap.data() : null);
    if (DATA){ render(); if (view==='month' && !editing) renderSheet(); }
  }, ()=>{});
}
async function saveTbr(){
  render(); if (view==='month' && !editing) renderSheet();
  if (!FB || !tbrRef) return;
  setStatus('saving','Saving');
  try {
    // "months" is only here because the security rules refuse a document without one
    await FB.fs.setDoc(tbrRef, { months:['tbr'], items: TBR.items,
      meta:{ updatedBy: me||'', updatedAt: new Date().toISOString() } });
    setStatus('live','All changes saved');
  } catch(e){ setStatus('err','Save failed — check your connection'); }
}

async function addTbr(){
  const title = $('#tbr-title').value.trim();
  if (!title){ toast('Give it a title'); $('#tbr-title').focus(); return; }
  const item = { id:newId(), title:title, author:$('#tbr-author').value.trim(),
    addedBy:$('#tbr-who').value||MUTUAL, plan: planParts($('#tbr-month').value) ? $('#tbr-month').value : '',
    cover:'', pages:num($('#tbr-pages').value), genres:[], addedAt:new Date().toISOString() };
  TBR.items.push(item);
  $('#tbr-title').value = ''; $('#tbr-author').value = ''; $('#tbr-pages').value = ''; $('#tbr-title').focus();
  saveTbr(); toast(item.title+' is on the TBR');

  // find its cover in the background, so the list looks like a shelf rather than a spreadsheet
  const info = await lookupBook(item.title, item.author);
  const live = TBR.items.find(t=>t.id===item.id);        // it may have been removed meanwhile
  if (!live) return;
  let hit = false;
  if (!live.cover && info.covers.length){ live.cover = info.covers[0].url; hit = true; }
  if (live.pages==null && info.pages){ live.pages = info.pages; hit = true; }
  if (!live.genres.length && info.genres.length){ live.genres = info.genres; hit = true; }
  if (hit) saveTbr();
}
function setTbrPlan(id, plan){
  const t = TBR.items.find(x=>x.id===id);
  if (!t) return;
  t.plan = planParts(plan) ? plan : '';
  saveTbr();
}
function removeTbr(id){
  const i = TBR.items.findIndex(x=>x.id===id);
  if (i<0) return;
  const gone = TBR.items.splice(i,1)[0];
  saveTbr(); toast(gone.title+' removed from the TBR');
}

// put a book into a month of a year's data, making the month if that year does not have it yet
function putBook(d, monthNo, book){
  let m = d.months.find(x=>MONTH_NO[String(x.id).toLowerCase()]===monthNo);
  if (!m){
    m = { id:MONTHS[monthNo-1].toLowerCase(), name:MONTHS[monthNo-1], boms:[], top:[] };
    d.months.push(m);
    d.months.sort((a,b)=>(MONTH_NO[String(a.id).toLowerCase()]||99)-(MONTH_NO[String(b.id).toLowerCase()]||99));
  }
  (m.boms = m.boms||[]).push(newBom(book));
}
async function addBookToMonth(year, monthNo, book){
  if (year === YEAR){ putBook(DATA, monthNo, book); queueSave(); return; }      // the year on screen
  if (!FB){                                                                     // not syncing
    if (!LOCAL[year]) LOCAL[year] = migrate(blankYear(year, DATA));
    putBook(LOCAL[year], monthNo, book); return;
  }
  // a different year from the one on screen: open that year's saved data, add the book, save it back
  const ref = FB.fs.doc(FB.db, window.COLLECTION, String(year));
  const snap = await FB.fs.getDoc(ref);
  const d = snap.exists() ? migrate(snap.data()) : migrate(blankYear(year, DATA));
  putBook(d, monthNo, book);
  d.meta = { updatedBy: me||'', updatedAt: new Date().toISOString() };
  await FB.fs.setDoc(ref, d);
}

// "Add book": the confirmation. Moves the book from the TBR into its month.
async function confirmTbr(id){
  const t = TBR.items.find(x=>x.id===id), p = t && planParts(t.plan);
  if (!t || tbrBusy.has(id)) return;
  if (!p) return toast('Pick a month first');
  tbrBusy.add(id);
  try {
    await addBookToMonth(p.year, p.no, { title:t.title, author:t.author, cover:t.cover,
      pages:t.pages, genres:t.genres.slice(), pickedBy:t.addedBy });
  } catch(e){
    tbrBusy.delete(id);
    return toast('Could not add it — check your connection');
  }
  tbrBusy.delete(id);
  const i = TBR.items.findIndex(x=>x.id===id);
  if (i>=0) TBR.items.splice(i,1);
  saveTbr();
  toast(t.title+' added to '+planLabel(t.plan));
}

// the choices in a month dropdown: this month and the 17 after it (so next year is covered),
// plus whatever a book already has, even if that month has since passed
function monthOptions(current){
  const now = new Date(), keys = [];
  for (let i=0;i<18;i++){
    const d = new Date(now.getFullYear(), now.getMonth()+i, 1);
    keys.push(planKey(d.getFullYear(), d.getMonth()+1));
  }
  if (current && !keys.includes(current)) keys.unshift(current);
  return '<option value="">No month yet</option>'+keys.map(k=>
    '<option value="'+k+'"'+(k===current?' selected':'')+'>'+esc(planLabel(k))+'</option>').join('');
}

function renderTbr(){
  const n = TBR.items.length;
  $('#tbr-count').textContent = n || '';
  $('#tbr-count').hidden = !n;

  // the two dropdowns in the "add" form; only rebuilt when the month or the readers change,
  // so whatever you had selected stays selected
  const now = new Date(), nowKey = planKey(now.getFullYear(), now.getMonth()+1);
  const mSel = $('#tbr-month'), wSel = $('#tbr-who');
  const sig = nowKey+'|'+DATA.members.map(x=>x.id+'/'+x.name+'/'+x.emoji).join(',');
  if (mSel.dataset.sig !== sig){
    mSel.dataset.sig = sig;
    mSel.innerHTML = monthOptions(planParts(mSel.value) ? mSel.value : '');
    const keep = wSel.value;
    wSel.innerHTML = pickOptions('');             // Mutual, then each of you
    wSel.value = keep || MUTUAL; wSel.dataset.me = '';
  }
  if (me && wSel.dataset.me !== me){ wSel.value = me; wSel.dataset.me = me; }   // default to whoever "You are"

  if (tbrEdit && !TBR.items.some(t=>t.id===tbrEdit.id)) tbrEdit = null;     // the book being edited is gone
  if (!n){
    $('#tbr-list').innerHTML = '<p class="empty-note">Nothing on the TBR yet. Add a book above, give it a month '+
      'whenever you have a plan, and press Add book on its row once you are sure.</p>';
    return;
  }
  // one group per month, in calendar order, with the undecided ones last
  const keys = [...new Set(TBR.items.map(t=>t.plan))].sort((a,b)=>
    ((a===''?1:0)-(b===''?1:0)) || a.localeCompare(b));
  $('#tbr-list').innerHTML = keys.map(k=>{
    const p = planParts(k), rows = TBR.items.filter(t=>t.plan===k);
    let note = '';
    if (!p) note = 'Not pencilled in for a month yet.';
    else if (k < nowKey) note = 'This month has already passed.';
    else if (p.year === YEAR){
      const m = DATA.months.find(x=>MONTH_NO[String(x.id).toLowerCase()]===p.no);
      const have = m ? (m.boms||[]).filter(b=>b.title).map(b=>b.title) : [];
      if (have.length) note = 'Already reading '+have.join(' and ')+' that month.';
    }
    return '<section class="tbr-group"><h3 class="tbr-month"><i style="background:'+
      (p ? MONTH_THEMES[p.no-1].colors['--accent'] : 'var(--fg-dim)')+'"></i>'+
      (p ? esc(MONTHS[p.no-1])+' <span>'+p.year+'</span>' : 'No month yet')+'</h3>'+
      (note ? '<p class="tbr-note">'+esc(note)+'</p>' : '')+
      rows.map(t=>{
        const ed = tbrEdit && tbrEdit.id===t.id ? tbrEdit : null;
        // while a row is being edited its cover shows the draft, so you see a new cover straight away
        return '<div class="tbr-row'+(ed?' editing':'')+'" data-id="'+esc(t.id)+'">'+
          coverMarkup(ed ? {title:t.title, cover:ed.cover} : t)+
          '<div class="tbr-book"><p class="card-title">'+esc(t.title)+'</p>'+
            (t.author?'<p class="card-author">'+esc(t.author)+'</p>':'')+tbrMeta(t)+'</div>'+
          '<select class="tbr-plan" data-tbr-plan aria-label="Month for '+esc(t.title)+'">'+monthOptions(t.plan)+'</select>'+
          '<button class="btn primary" data-tbr-add'+(planParts(t.plan)
            ? ' aria-label="Add '+esc(t.title)+' to '+esc(planLabel(t.plan))+'"'
            : ' disabled title="Pick a month first"')+'>Add book</button>'+
          '<button class="tbr-edit-btn" data-tbr-edit aria-expanded="'+(ed?'true':'false')+
            '" aria-label="Edit '+esc(t.title)+'">Edit</button>'+
          '<button class="tbr-del" data-tbr-del aria-label="Remove '+esc(t.title)+' from the TBR">×</button>'+
        '</div>'+(ed ? tbrEditor(ed) : '');
      }).join('')+'</section>';
  }).join('');
}

// the line under a TBR book: who picked it (in their colour) and how long it is
function tbrMeta(t){
  const lab = pickLabel(t.addedBy);
  if (!lab && !t.pages) return '';
  return '<p class="tbr-who">'+(lab?'<b style="color:'+pickColor(t.addedBy)+'">'+esc(lab)+'</b>':'')+
    (t.pages?'<span>'+t.pages+' pages</span>':'')+'</p>';
}

/* ---------- editing a TBR book ----------
   Pressing Edit opens a small form under the row. What you type goes into tbrEdit (a draft),
   NOT into the book, until you press Save changes; Cancel throws the draft away. Keeping it
   as a draft also means the form survives if the list redraws (say the other person adds a book). */
let tbrEdit = null;        // { id, title, author, pages, addedBy, cover, picks } while a form is open

function tbrPicks(ed){
  if (!ed.picks) return '';
  return '<div class="cover-picks"><div class="picks-head"><span>'+ed.picks.length+' covers for “'+esc(ed.title)+
    '”</span><button class="link" type="button" data-te-closepicks>Close</button></div>'+
    '<div class="picks-grid">'+ed.picks.map((c,i)=>
      '<button type="button" class="pick'+(c.url===ed.cover?' on':'')+'" data-te-pick="'+i+'" title="'+esc(c.label)+'">'+
      '<img src="'+esc(c.url)+'" alt="Cover option '+(i+1)+'" loading="lazy" onerror="this.parentNode.style.display=\'none\'">'+
      (c.label?'<span>'+esc(c.label)+'</span>':'')+'</button>').join('')+'</div></div>';
}
function tbrEditor(ed){
  return '<div class="tbr-editor edit-block" data-id="'+esc(ed.id)+'"><div class="row">'+
    '<label class="field"><span>Title</span><input type="text" data-te="title" value="'+esc(ed.title)+'"></label>'+
    '<label class="field"><span>Author</span><input type="text" data-te="author" value="'+esc(ed.author)+'"></label>'+
    '<label class="field"><span>Pages</span><input type="number" min="0" step="1" data-te="pages" value="'+esc(ed.pages==null?'':ed.pages)+'"></label>'+
    '<label class="field"><span>Suggested by</span><select data-te="addedBy">'+pickOptions(ed.addedBy)+'</select></label>'+
    '</div><div class="cover-row"><label class="field"><span>Cover image URL</span>'+
    '<input type="url" data-te="cover" value="'+esc(ed.cover)+'" placeholder="Paste one, or hit Browse covers"></label>'+
    '<button class="btn" type="button" data-te-find>Browse covers</button>'+
    '<button class="btn ghost" type="button" data-te-clear>Clear</button></div>'+
    '<div data-te-picksbox>'+tbrPicks(ed)+'</div>'+
    '<div class="tbr-editor-foot"><button class="btn primary" type="button" data-te-save>Save changes</button>'+
    '<button class="btn ghost" type="button" data-te-cancel>Cancel</button></div></div>';
}
function toggleTbrEdit(id){
  const t = TBR.items.find(x=>x.id===id);
  tbrEdit = (!t || (tbrEdit && tbrEdit.id===id)) ? null
    : { id:t.id, title:t.title, author:t.author, pages:t.pages, addedBy:t.addedBy, cover:t.cover, picks:null };
  renderTbr();
  const first = $('#tbr-list .tbr-editor [data-te="title"]');
  if (first) first.scrollIntoView({block:'nearest'});
}
// put a cover into the draft and show it in the row, the URL box and the grid of choices
function setTbrDraftCover(url){
  if (!tbrEdit) return;
  tbrEdit.cover = url;
  const editor = $('#tbr-list .tbr-editor'), row = editor && editor.previousElementSibling;
  if (!editor) return;
  const box = editor.querySelector('[data-te="cover"]');
  if (box.value !== url) box.value = url;
  editor.querySelectorAll('.pick').forEach((p,i)=>p.classList.toggle('on', !!url && tbrEdit.picks && tbrEdit.picks[i].url===url));
  if (row) row.querySelector('.cover-slot').outerHTML = coverMarkup({ title:tbrEdit.title, cover:url });
}
async function browseTbrCovers(){
  if (!tbrEdit) return;
  if (!tbrEdit.title.trim()) return toast('Add a title first');
  const id = tbrEdit.id, btn = $('#tbr-list .tbr-editor [data-te-find]');
  if (btn) btn.textContent = 'Searching…';
  const info = await lookupBook(tbrEdit.title.trim(), tbrEdit.author.trim());
  if (!tbrEdit || tbrEdit.id!==id) return;                     // the form was closed while it searched
  const again = $('#tbr-list .tbr-editor [data-te-find]');
  if (again) again.textContent = 'Browse covers';
  tbrEdit.picks = info.covers.length ? info.covers : null;
  const box = $('#tbr-list [data-te-picksbox]');
  if (box) box.innerHTML = tbrPicks(tbrEdit);
  if (!info.covers.length) toast('Nothing found — paste a URL instead');
}
function saveTbrEdit(){
  const t = tbrEdit && TBR.items.find(x=>x.id===tbrEdit.id);
  if (!t){ tbrEdit = null; return renderTbr(); }
  const title = String(tbrEdit.title||'').trim();
  if (!title) return toast('Give it a title');
  t.title = title;
  t.author = String(tbrEdit.author||'').trim();
  t.pages = num(tbrEdit.pages);
  t.addedBy = tbrEdit.addedBy || MUTUAL;
  t.cover = String(tbrEdit.cover||'').trim();
  tbrEdit = null;
  saveTbr(); toast('Saved');
}

$('#tbr-form').addEventListener('submit', e=>{ e.preventDefault(); addTbr(); });
// typing in the edit form goes into the draft
const intoDraft = e => {
  const el = e.target.closest('[data-te]');
  if (!el || !tbrEdit) return;
  const k = el.dataset.te;
  tbrEdit[k] = k==='pages' ? (el.value==='' ? null : Number(el.value)) : el.value;
  if (k==='cover') setTbrDraftCover(el.value.trim());        // pasted a link: show it straight away
};
$('#tbr-list').addEventListener('input', intoDraft);
$('#tbr-list').addEventListener('change', e=>{
  const sel = e.target.closest('[data-tbr-plan]');
  if (sel) return setTbrPlan(sel.closest('[data-id]').dataset.id, sel.value);
  intoDraft(e);
});
$('#tbr-list').addEventListener('keydown', e=>{
  if (e.key==='Enter' && e.target.closest('input[data-te]')){ e.preventDefault(); saveTbrEdit(); }
});
$('#tbr-list').addEventListener('click', e=>{
  const row = e.target.closest('[data-id]');
  if (!row) return;
  const hit = sel => e.target.closest(sel);
  if (hit('[data-tbr-add]')) return confirmTbr(row.dataset.id);
  if (hit('[data-tbr-edit]')) return toggleTbrEdit(row.dataset.id);
  if (hit('[data-te-save]')) return saveTbrEdit();
  if (hit('[data-te-cancel]')){ tbrEdit = null; return renderTbr(); }
  if (hit('[data-te-clear]')) return setTbrDraftCover('');
  if (hit('[data-te-find]')) return browseTbrCovers();
  if (hit('[data-te-closepicks]')){ if (tbrEdit) tbrEdit.picks = null; hit('[data-te-picksbox]').innerHTML = ''; return; }
  if (hit('[data-te-pick]')){
    if (tbrEdit && tbrEdit.picks) setTbrDraftCover(tbrEdit.picks[Number(hit('[data-te-pick]').dataset.tePick)].url);
    return;
  }
  const del = hit('[data-tbr-del]');
  if (!del) return;
  if (del.classList.contains('armed')) return removeTbr(row.dataset.id);
  del.classList.add('armed'); del.textContent = 'Remove?';
  setTimeout(()=>{ if (del.isConnected){ del.classList.remove('armed'); del.textContent = '×'; } }, 3000);
});

/* ================= grid ================= */
function coverMarkup(book, cls, emptyText){
  const t = esc(book && book.title || '');
  const img = book && book.cover
    ? '<img src="'+esc(book.cover)+'" alt="Cover of '+t+'" loading="lazy" onerror="this.style.display=\'none\'">' : '';
  return '<div class="cover-slot '+(cls||'')+'"><div class="cover-fallback">'+(t||esc(emptyText||'No book yet'))+'</div>'+img+'</div>';
}

/* two or three covers fanned out, for months with more than one shared book */
function coverStack(books){
  const shown = books.slice(0,3);
  return '<div class="cover-stack n'+shown.length+'">'+shown.map(b=>coverMarkup(b)).join('')+
    (books.length>3 ? '<span class="more">+'+(books.length-3)+'</span>' : '')+'</div>';
}

function render(){
  if (!DATA) return;
  $('#club-title').innerHTML = esc(DATA.club.name).replace(/(\S+)$/,'<em>$1</em>');
  $('#eyebrow-text').textContent = YEAR+' · '+(DATA.club.zodiac||('Year of the '+zodiacFor(YEAR)));
  $('#yr-prev').disabled = YEAR <= Number(window.START_YEAR);

  const scored = allBooks().filter(b=>b.title);
  const bits = ['<span><b>'+DATA.months.filter(m=>(m.boms||[]).length||(m.top||[]).length).length+'</b> months filled in</span>',
                '<span><b>'+scored.length+'</b> books logged</span>'];
  DATA.members.forEach(m=>{
    const vals = allBooks().flatMap(b => b.scores
      ? (b.scores[m.id]!=null ? [Number(b.scores[m.id])] : [])
      : (b.member===m.id && b.score!=null && b.score!=='' ? [Number(b.score)] : [])
    ).filter(n=>!isNaN(n));
    if (vals.length) bits.push('<span>'+esc(m.name)+' averages <b>'+
      (vals.reduce((a,c)=>a+c,0)/vals.length).toFixed(2)+'</b></span>');
  });
  $('#colophon').innerHTML = bits.join('');

  const today = new Date(), thisMonth = today.getMonth()+1;
  const sameYear = today.getFullYear() === YEAR;

  // The shelf. Each month is just its cover (or fanned covers), with the month name above
  // and the title and scores underneath - no box around it.
  const pastYear = YEAR < today.getFullYear();
  const scorePill = (v, who, color) =>
    '<span class="sc'+(v===null?' none':'')+'"'+(color?' style="--c:'+color+'"':'')+'><b>'+
    (v===null?'—':v)+'</b>'+esc(who)+'</span>';

  $('#grid').innerHTML = DATA.months.map(m=>{
    const boms = m.boms || [], tops = m.top || [];
    // what a card shows: the book(s) you read together, or failing that each person's top book
    const shared = boms.length > 0;
    const items = shared ? boms : tops;
    const hasScores = shared
      ? boms.some(b=>DATA.members.some(x=>fmtScore((b.scores||{})[x.id])!==null))
      : tops.some(b=>fmtScore(b.score)!==null);
    const no = MONTH_NO[String(m.id).toLowerCase()]||0;
    const isNow = sameYear && no===thisMonth;
    const isPast = pastYear || (sameYear && no && no<thisMonth);

    // nothing confirmed for this month, but something on the TBR is pencilled in for it
    const planned = items.length ? [] : plannedFor(YEAR, no);

    // the small badge on the cover
    const kind = isNow ? 'Reading now'
      : planned.length ? 'Planned'
      : !items.length ? ''
      : !hasScores ? (isPast ? 'Not scored' : 'To read')
      : !shared ? 'Top books'
      : items.length>1 ? items.length+' books' : '';

    const body = items.map(b=>{
      const g = shared && items.length===1 ? fmtScore(b.goodreads) : null;
      return '<div class="cbook"><p class="card-title">'+esc(b.title||'Untitled')+'</p>'+
        (b.author?'<p class="card-author">'+esc(b.author)+'</p>':'')+
        '<div class="scores">'+
          (shared
            ? DATA.members.map(x=>scorePill(fmtScore((b.scores||{})[x.id]), memberLabel(x.id), readerColor(x.id))).join('')
            : scorePill(fmtScore(b.score), memberLabel(b.member), readerColor(b.member)))+
          (g ? scorePill(g, 'Goodreads') : '')+
        '</div></div>';
    }).join('') || planned.map(t=>
      '<div class="cbook"><p class="card-title">'+esc(t.title)+'</p>'+
      (t.author?'<p class="card-author">'+esc(t.author)+'</p>':'')+
      '<div class="scores"><span class="sc">On the TBR</span></div></div>').join('');
    const covers = items.length ? items : planned;

    return '<button class="card'+(isNow?' is-now':'')+(items.length?'':(planned.length?' planned':' empty'))+(hasScores?'':' pending')+
      '" data-month="'+esc(m.id)+'" aria-label="Open '+esc(m.name)+
      (items.length>1?', '+items.length+' books':'')+(isNow?', reading now':'')+'">'+
      '<div class="card-top"><span class="card-month">'+esc(m.name)+'</span></div>'+
      (kind?'<span class="card-kind">'+kind+'</span>':'')+
      (covers.length>1 ? coverStack(covers) : coverMarkup(covers[0]||null, '', 'Nothing picked yet'))+
      (body?'<div class="card-body">'+body+'</div>':'')+'</button>';
  }).join('');

  $('#grid').querySelectorAll('.card').forEach(c=>
    c.addEventListener('click',()=>openSheet('month', c.dataset.month)));
  paintLayout(); renderList(); renderNow(); renderTbr();
  paintLastEdit();
}

/* ================= list view ================= */
// Which view is showing: 'cards' (the month grid), 'list' (one row per book) or 'tbr'.
// Remembered per browser, so each of you keeps whichever you prefer.
let layout = 'cards';
try { const saved = localStorage.getItem('bookclub-layout'); if (saved==='list' || saved==='tbr') layout = saved; } catch(e){}

// sort = the column being sorted, dir = 1 (A-Z, low-high) or -1 (high-low),
// f = the current filter values, keyed by column
const LIST = { sort:'month', dir:1, f:{}, sig:'' };

// value, label, and a shorter label for phones
const SCORE_FILTERS = [['','All'],['any','Scored'],['none','Not scored'],
  ['4.5','4.5 and up','4.5+'],['4','4 and up','4+'],['3','3 and up','3+'],['lt3','Under 3','<3']];
const isNarrow = () => window.matchMedia('(max-width:640px)').matches;
function scorePass(v, f){
  if (!f) return true;
  if (f==='none') return v==null;
  if (v==null) return false;
  if (f==='any') return true;
  if (f==='lt3') return v<3;
  return v >= Number(f);
}

function setLayout(next){
  layout = (next==='list' || next==='tbr') ? next : 'cards';
  try { localStorage.setItem('bookclub-layout', layout); } catch(e){}
  paintLayout();
}
function paintLayout(){
  $('#grid').hidden = layout!=='cards';
  $('#listview').hidden = layout!=='list';
  $('#tbrview').hidden = layout!=='tbr';
  document.querySelectorAll('[data-layout]').forEach(b=>
    b.setAttribute('aria-pressed', String(b.dataset.layout===layout)));
}

// The columns, left to right. One score column per reader, so it follows DATA.members.
// dir is which way a column sorts on the first click (scores start high-to-low).
function listColumns(){
  return [
    {key:'cover', label:'Cover'},
    {key:'title', label:'Book', sort:true, dir:1},
    {key:'month', label:'Month', sort:true, dir:1},
    ...DATA.members.map(x=>({key:'s:'+x.id, label:memberLabel(x.id), sort:true, dir:-1, score:true})),
    {key:'gr', label:'Goodreads', sort:true, dir:-1, score:true},
    {key:'pages', label:'Pages', sort:true, dir:-1},
    {key:'type', label:'Type', sort:true, dir:1},
    {key:'genres', label:'Genres'}
  ];
}

// Flattens the year into one row per book: shared books first, then each
// person's top books (those only have a score in their own column).
function listRows(){
  const out = [];
  DATA.months.forEach((m,mi)=>{
    const monthNo = MONTH_NO[String(m.id).toLowerCase()] || (mi+1);
    const add = row => out.push(Object.assign(row, {monthId:m.id, month:m.name, monthNo:monthNo}));
    (m.boms||[]).forEach((b,i)=>{
      if (!b.title) return;
      const scores = {};
      DATA.members.forEach(x=>{ scores[x.id] = num((b.scores||{})[x.id]); });
      add({ book:b, type:'together', typeLabel:'Read together', order:i, scores:scores,
        sub: pickLabel(b.pickedBy),
        subColor: pickLabel(b.pickedBy) ? pickColor(b.pickedBy) : '',
        gr:num(b.goodreads), pages:num(b.pages) });
    });
    (m.top||[]).forEach((b,i)=>{
      if (!b.title) return;
      const scores = {};
      DATA.members.forEach(x=>{ scores[x.id] = x.id===b.member ? num(b.score) : null; });
      add({ book:b, type:'top:'+b.member, typeLabel:'Top book', order:100+i, scores:scores,
        sub: member(b.member).name, subColor: readerColor(b.member),
        gr:null, pages:num(b.pages) });
    });
  });
  // "hay" is the text the search box looks through
  out.forEach(r=>{ r.hay = [r.book.title, r.book.author].concat(r.book.genres||[]).join(' ').toLowerCase(); });
  return out;
}

function listValue(r, key){
  if (key==='title') return String(r.book.title||'').toLowerCase();
  if (key==='month') return r.monthNo;
  if (key==='gr') return r.gr;
  if (key==='pages') return r.pages || null;
  if (key==='type') return r.type;
  if (key.slice(0,2)==='s:') return r.scores[key.slice(2)];
  return null;
}
function listCompare(a, b){
  const x = listValue(a, LIST.sort), y = listValue(b, LIST.sort);
  let r = 0;
  if (x==null || y==null){
    // blanks always sink to the bottom, whichever way you sort
    if (x==null && y!=null) return 1;
    if (y==null && x!=null) return -1;
  } else {
    r = (typeof x==='string' ? x.localeCompare(y) : x-y) * LIST.dir;
  }
  // ties fall back to calendar order
  return r || (a.monthNo-b.monthNo) || (a.order-b.order);
}

// Header + filter row. Only rebuilt when the year or the readers change, so
// typing in the search box never loses your cursor.
function buildListHead(){
  const cols = listColumns(), f = LIST.f;
  const narrow = isNarrow();     // phone: shorter labels so they fit the small boxes
  const opt = (v,l,cur)=>'<option value="'+esc(v)+'"'+((cur||'')===v?' selected':'')+'>'+esc(l)+'</option>';
  const filterCell = c => {
    if (c.key==='title') return '<input type="text" data-lf="q" value="'+esc(f.q||'')+
      '" placeholder="Search" title="Searches title, author and genre" aria-label="Search title, author or genre">';
    if (c.key==='month') return '<select data-lf="month" aria-label="Filter by month">'+
      opt('','All',f.month)+DATA.months.map(m=>opt(m.id, narrow ? String(m.name).slice(0,3) : m.name, f.month)).join('')+'</select>';
    if (c.score) return '<select data-lf="'+esc(c.key)+'" aria-label="Filter by '+esc(c.label)+' score">'+
      SCORE_FILTERS.map(([v,l,short])=>opt(v, narrow && short ? short : l, f[c.key])).join('')+'</select>';
    if (c.key==='type') return '<select data-lf="type" aria-label="Filter by type">'+
      opt('','All',f.type)+opt('together','Read together',f.type)+opt('top','Top books',f.type)+
      DATA.members.map(x=>opt('top:'+x.id, x.name+"'s top books", f.type)).join('')+'</select>';
    return '';
  };
  $('#books-head').innerHTML =
    '<tr>'+cols.map(c=> c.sort
      ? '<th scope="col" data-col="'+esc(c.key)+'"><button class="th-btn" data-sort="'+esc(c.key)+
        '" data-dir="'+c.dir+'">'+esc(c.label)+
        '<span class="arrows" aria-hidden="true"><i class="up"></i><i class="dn"></i></span></button></th>'
      : '<th scope="col" class="th-plain">'+esc(c.label)+'</th>').join('')+'</tr>'+
    '<tr class="filters">'+cols.map(c=>'<th>'+filterCell(c)+'</th>').join('')+'</tr>';
}

// Rows, the averages line and the "Showing x of y" count. Runs on every sort/filter change.
function paintList(){
  const cols = listColumns(), f = LIST.f, members = DATA.members;
  $('#books-head').querySelectorAll('th[data-col]').forEach(th=>{
    if (th.dataset.col===LIST.sort) th.setAttribute('aria-sort', LIST.dir>0 ? 'ascending' : 'descending');
    else th.removeAttribute('aria-sort');
  });
  $('#books-head').querySelectorAll('[data-lf]').forEach(el=>el.classList.toggle('on', !!el.value));

  const all = listRows();
  const q = String(f.q||'').trim().toLowerCase();
  const rows = all.filter(r=>{
    if (q && !r.hay.includes(q)) return false;
    if (f.month && r.monthId!==f.month) return false;
    if (f.type==='top' ? r.type==='together' : (f.type && r.type!==f.type)) return false;
    if (!scorePass(r.gr, f.gr)) return false;
    return members.every(x=>scorePass(r.scores[x.id], f['s:'+x.id]));
  }).sort(listCompare);

  const numCell = (v, color) => {
    const t = fmtScore(v);
    return '<td class="num'+(t===null?' none':'')+'"'+(t!==null&&color?' style="color:'+color+'"':'')+'>'+
      (t===null?'—':t)+'</td>';
  };
  const filtering = Object.values(f).some(v=>String(v||'').trim());

  $('#books-body').innerHTML = rows.length ? rows.map(r=>
    '<tr tabindex="0" data-month="'+esc(r.monthId)+'">'+
    '<td class="c-cover">'+coverMarkup(r.book)+'</td>'+
    '<td class="c-book"><p class="lt">'+esc(r.book.title)+'</p>'+
      (r.book.author?'<p class="la">'+esc(r.book.author)+'</p>':'')+'</td>'+
    '<td class="c-month"><span class="mfull">'+esc(r.month)+'</span>'+
      '<span class="mabbr" aria-hidden="true">'+esc(String(r.month).slice(0,3))+'</span></td>'+
    members.map(x=>numCell(r.scores[x.id], readerColor(x.id))).join('')+
    numCell(r.gr)+
    '<td class="num'+(r.pages?'':' none')+'">'+(r.pages ? r.pages.toLocaleString() : '—')+'</td>'+
    '<td class="c-type">'+esc(r.typeLabel)+
      (r.sub?'<small style="color:'+r.subColor+'">'+esc(r.sub)+'</small>':'')+'</td>'+
    '<td class="c-genres">'+esc((r.book.genres||[]).join(', '))+'</td></tr>').join('')
    : '<tr class="none"><td colspan="'+cols.length+'">'+(all.length
        ? 'No books match those filters. <button class="link" data-clear-list="1">Clear filters</button>'
        : 'No books logged for '+YEAR+' yet.')+'</td></tr>';

  // averages for whatever is showing, e.g. filter to October and see how October went
  const avg = vals => { const v = vals.filter(n=>n!=null);
    return v.length ? v.reduce((a,c)=>a+c,0)/v.length : null; };
  const pages = rows.reduce((a,r)=>a+(r.pages||0),0);
  $('#books-foot').innerHTML = rows.length
    ? '<tr><td colspan="3">Average of the '+rows.length+' shown</td>'+
      members.map(x=>numCell(avg(rows.map(r=>r.scores[x.id])), readerColor(x.id))).join('')+
      numCell(avg(rows.map(r=>r.gr)))+
      '<td class="num'+(pages?'':' none')+'">'+(pages ? pages.toLocaleString() : '—')+'</td>'+
      '<td colspan="2">'+(pages?'pages in total':'')+'</td></tr>'
    : '';

  const word = n => n+' book'+(n===1?'':'s');
  $('#list-count').textContent = rows.length===all.length
    ? 'Showing all '+word(all.length)+' from '+YEAR
    : 'Showing '+rows.length+' of '+word(all.length)+' from '+YEAR;
  $('#list-clear').hidden = !filtering;
}

function renderList(){
  if (!DATA) return;
  const sig = YEAR+'|'+DATA.members.map(m=>m.id+'/'+m.name+'/'+m.emoji).join(',')+
    '|'+DATA.months.map(m=>m.id).join(',')+'|'+isNarrow();
  if (LIST.sig !== sig){ LIST.sig = sig; buildListHead(); }
  paintList();
}
function clearListFilters(){ LIST.f = {}; LIST.sig = ''; renderList(); }

// One set of listeners on the table rather than one per cell, so they survive re-renders.
document.querySelectorAll('[data-layout]').forEach(b=>
  b.addEventListener('click',()=>setLayout(b.dataset.layout)));
$('#books-head').addEventListener('click', e=>{
  const b = e.target.closest('[data-sort]');
  if (!b) return;
  if (LIST.sort===b.dataset.sort) LIST.dir = -LIST.dir;          // same column: flip direction
  else { LIST.sort = b.dataset.sort; LIST.dir = Number(b.dataset.dir)||1; }
  paintList();
});
['input','change'].forEach(ev=>$('#books-head').addEventListener(ev, e=>{
  const el = e.target.closest('[data-lf]');
  if (!el) return;
  LIST.f[el.dataset.lf] = el.value;
  paintList();
}));
$('#books-body').addEventListener('click', e=>{
  if (e.target.closest('[data-clear-list]')) return clearListFilters();
  const tr = e.target.closest('tr[data-month]');
  if (tr) openSheet('month', tr.dataset.month);
});
$('#books-body').addEventListener('keydown', e=>{
  if (e.key!=='Enter' && e.key!==' ') return;
  const tr = e.target.closest('tr[data-month]');
  if (!tr) return;
  e.preventDefault(); openSheet('month', tr.dataset.month);
});
$('#list-clear').addEventListener('click', clearListFilters);

/* ================= reading now ================= */
// The block under the title: this month's shared book(s), both scores, and how much
// of the month is left. Only shown when you are looking at the current year.
function renderNow(){
  const el = $('#now'), today = new Date();
  const idx = DATA.months.findIndex(m => MONTH_NO[String(m.id).toLowerCase()] === today.getMonth()+1);
  if (today.getFullYear() !== YEAR || idx < 0){ el.hidden = true; el.innerHTML = ''; return; }

  const m = DATA.months[idx];
  const books = (m.boms||[]).filter(b=>b.title);
  const days = new Date(YEAR, today.getMonth()+1, 0).getDate();   // day 0 of next month = last day of this one
  const day = today.getDate(), left = days - day;
  const leftText = left===0 ? 'Last day of '+m.name
    : left+' day'+(left===1?'':'s')+' left in '+m.name;

  // next month's pick, if there is one, as a quiet line at the bottom
  const nm = DATA.months[idx+1];
  const upNext = nm ? (nm.boms||[]).filter(b=>b.title).map(b=>b.title) : [];
  // nothing confirmed? then show what the TBR has pencilled in (December looks ahead to January)
  const thisNo = today.getMonth()+1;
  const nx = thisNo===12 ? { year:YEAR+1, no:1 } : { year:YEAR, no:thisNo+1 };
  const plannedNext = upNext.length ? [] : plannedFor(nx.year, nx.no).map(t=>t.title);
  const plannedNow = books.length ? [] : plannedFor(YEAR, thisNo).map(t=>t.title);

  const washes = books.filter(b=>b.cover).slice(0,3);
  el.innerHTML =
    (washes.length ? '<div class="now-wash" aria-hidden="true">'+washes.map(b=>
      '<img src="'+esc(b.cover)+'" alt="" onerror="this.remove()">').join('')+'</div>' : '')+
    '<div class="now-in">'+
      '<div class="now-head"><span class="now-label">Reading now</span>'+
        '<span class="now-month">'+esc(m.name)+' '+YEAR+'</span></div>'+
      (books.length
        ? '<div class="now-books">'+books.map(b=>
            '<article class="now-book">'+coverMarkup(b)+'<div>'+
              '<h2 class="book-title">'+esc(b.title)+'</h2>'+
              (b.author?'<p class="book-author">'+esc(b.author)+'</p>':'')+
              bookTags(b)+scoreLine(b)+
            '</div></article>').join('')+'</div>'
        : '<p class="now-empty">Nothing picked for '+esc(m.name)+' yet</p>'+
          (plannedNow.length ? '<p class="now-next">On the TBR for '+esc(m.name)+': <b>'+
            plannedNow.map(esc).join('</b> and <b>')+'</b></p>' : ''))+
      '<div class="now-foot">'+
        '<div class="now-days"><div class="bar" role="img" aria-label="Day '+day+' of '+days+'">'+
          '<i style="width:'+Math.round(day/days*100)+'%"></i></div>'+esc(leftText)+'</div>'+

/* ================= sheet ================= */
function openSheet(kind, id){
  view = kind; openMonth = id||null; editing = false;
  $('#sheet').classList.add('open'); $('#scrim').classList.add('open'); $('#scrim').classList.remove('thin');
  document.body.classList.add('locked');
  renderSheet();
  const f = $('#sheet-inner [data-act="close"]'); if (f) f.focus();
}
function closeSheet(){
  if (editing && view==='month'){
    const m = DATA.months.find(x=>x.id===openMonth);
    if (m){ commitFields(m); queueSave(); }
  }
  view = null; openMonth = null; editing = false;
  paintWash([]);
  $('#sheet').classList.remove('open'); $('#scrim').classList.remove('open','thin');
  document.body.classList.remove('locked');
  render();
}

function renderSheet(){
  if (view==='month') return renderMonthSheet();
  paintWash([]);
  if (view==='wrapped') return renderWrapped();
}

/* The colour behind an open month: its covers, blurred until only their colours are left
   (see .sheet-wash in the styles). Rebuilt only when the covers change, so it doesn't
   flicker while you type. */
function paintWash(covers){
  const el = $('#sheet-wash'), sig = (covers||[]).join('|');
  if (el.dataset.sig !== sig){
    el.dataset.sig = sig;
    el.innerHTML = sig ? '<div class="imgs">'+covers.map(c=>
      '<img src="'+esc(c)+'" alt="" onerror="this.remove()">').join('')+'</div>' : '';
  }
  el.classList.toggle('on', !!sig);
}

/* ---------- month sheet ---------- */
function renderMonthSheet(){
  const m = DATA.months.find(x=>x.id===openMonth);
  if (!m) return;
  const shown = (m.boms||[]).length ? m.boms : (m.top||[]).length ? m.top
    : plannedFor(YEAR, MONTH_NO[String(m.id).toLowerCase()]||0);
  paintWash(shown.map(b=>b.cover).filter(Boolean).slice(0,3));
  const label = editing ? 'Done' : (me ? 'Add '+esc(member(me).name)+"'s scores" : 'Edit this month');
  $('#sheet-inner').innerHTML =
    '<div class="sheet-bar"><button class="btn ghost" data-act="close">← All months</button>'+
    '<button class="btn '+(editing?'primary':'')+'" data-act="toggle-edit">'+label+'</button></div>'+
    '<h2 class="sheet-month">'+esc(m.name)+' '+YEAR+'</h2>'+

/* ---------- field plumbing ---------- */
function getPath(obj, path){
  return path.split('.').reduce((o,k)=> (o==null ? o : o[k]), obj);
}
function setPath(obj, path, val){
  const p = path.split('.');
  let cur = obj;
  for (let i=0;i<p.length-1;i++){
    if (cur[p[i]]==null) cur[p[i]] = /^\d+$/.test(p[i+1]) ? [] : {};
    cur = cur[p[i]];
  }
  cur[p[p.length-1]] = val;
}
function commitFields(m){
  $('#sheet-inner').querySelectorAll('[data-f]').forEach(el=>{
    let v = el.value;
    if (el.type==='number') v = v==='' ? null : Number(v);
    setPath(m, el.dataset.f, v);
  });
  // drop empty quotes
  (m.boms||[]).forEach(b=>{
    b.quotes = b.quotes || {};
    DATA.members.forEach(x=>{
      b.quotes[x.id] = (b.quotes[x.id]||[]).map(s=>String(s||'').trim()).filter(Boolean);
    });
  });
  (m.top||[]).forEach(b=>{ b.quotes = (b.quotes||[]).map(s=>String(s||'').trim()).filter(Boolean); });
}

function wireMonthSheet(m){
  const root = $('#sheet-inner');
  root.querySelectorAll('[data-act]').forEach(btn=>btn.addEventListener('click',()=>{
    const act = btn.dataset.act;
    if (act==='tbr-add') return confirmTbr(btn.dataset.id);     // redraws the page itself when done
    if (editing && act!=='close') commitFields(m);
    if (act==='close') return closeSheet();
    if (act==='toggle-edit'){ editing=!editing; if(!editing) queueSave(); }
    if (act==='add-bom') (m.boms=m.boms||[]).push(newBom({pickedBy: me||''}));
    if (act==='remove-bom') m.boms.splice(Number(btn.dataset.i),1);
    if (act==='add-top') (m.top=m.top||[]).push({member: me||DATA.members[0].id, title:'', author:'',
      score:null, cover:'', pages:null, genres:[], quotes:[]});
    if (act==='remove-top') m.top.splice(Number(btn.dataset.i),1);
    render(); renderSheet();
    // a freshly added book: jump to it instead of leaving you at the top of the page
    if (act==='add-bom' || act==='add-top'){
      const path = act==='add-bom' ? 'boms.'+(m.boms.length-1) : 'top.'+(m.top.length-1);
      const input = root.querySelector('[data-f="'+path+'.title"]');
      if (input){ input.scrollIntoView({block:'center'}); input.focus({preventScroll:true}); }
    }
  }));

  root.querySelectorAll('[data-addq]').forEach(btn=>btn.addEventListener('click',()=>{
    commitFields(m);
    const list = getPath(m, btn.dataset.addq) || [];
    list.push('');
    setPath(m, btn.dataset.addq, list);
    renderSheet();
  }));
  root.querySelectorAll('[data-delq]').forEach(btn=>btn.addEventListener('click',()=>{
    commitFields(m);
    const list = getPath(m, btn.dataset.delq) || [];
    list.splice(Number(btn.dataset.i),1);
    render(); renderSheet();
  }));
  root.querySelectorAll('[data-clear]').forEach(btn=>btn.addEventListener('click',()=>{
    commitFields(m);
    const b = getPath(m, btn.dataset.clear);
    if (b){ b.cover=''; render(); renderSheet(); }
  }));

  root.querySelectorAll('[data-find]').forEach(btn=>btn.addEventListener('click', async ()=>{
    commitFields(m);
    const path = btn.dataset.find, book = getPath(m, path);
    const box = root.querySelector('[data-picks="'+path+'"]');
    if (!book || !book.title) return toast('Add a title first');
    btn.textContent = 'Searching…';
    const info = await lookupBook(book.title, book.author);
    btn.textContent = 'Browse covers';
    if (!info.covers.length){ box.innerHTML=''; return toast('Nothing found — paste a URL instead'); }
    box.innerHTML = '<div class="cover-picks"><div class="picks-head"><span>'+info.covers.length+
      ' covers for “'+esc(book.title)+'”</span><button class="link" data-close-picks="1">Close</button></div>'+
      '<div class="picks-grid">'+info.covers.map((c,i)=>
        '<button class="pick'+(c.url===book.cover?' on':'')+'" data-i="'+i+'" title="'+esc(c.label)+'">'+
        '<img src="'+esc(c.url)+'" alt="Cover option '+(i+1)+'" loading="lazy" '+
        'onerror="this.parentNode.style.display=\'none\'">'+
        (c.label?'<span>'+esc(c.label)+'</span>':'')+'</button>').join('')+'</div></div>';
    box.querySelectorAll('.pick').forEach(p=>p.addEventListener('click',()=>{
      book.cover = info.covers[Number(p.dataset.i)].url;
      box.querySelectorAll('.pick').forEach(x=>x.classList.remove('on'));
      p.classList.add('on');
      const input = root.querySelector('[data-f="'+path+'.cover"]');
      if (input) input.value = book.cover;
      render(); queueSave(); toast('Cover set');
    }));
    box.querySelector('[data-close-picks]').addEventListener('click',()=>{ box.innerHTML=''; });
  }));
}

/* ================= wrapped ================= */
function statsFor(){
  const s = { books:0, pages:0, byMember:{}, gaps:[], genres:{}, grDelta:[], picks:{},
    mutual:{n:0, room:[], best:null, worst:null} };
  DATA.members.forEach(x=>{
    s.byMember[x.id]={scores:[],pages:0,best:null,count:0};
    s.picks[x.id]={n:0, room:[], best:null, worst:null};
  });

  DATA.months.forEach(m=>{
    (m.boms||[]).forEach(bom=>{
      const sc = bom.scores||{};
      const vals = DATA.members.map(x=>num(sc[x.id]));
      if (!vals.some(v=>v!=null)) return;          // nobody has scored this one yet
      s.books++;
      if (bom.pages) s.pages += bom.pages;
      (bom.genres||[]).forEach(g=>{
        s.genres[g] = s.genres[g] || {n:0, sum:0, c:0};
        s.genres[g].n++;
        vals.forEach(v=>{ if(v!=null){ s.genres[g].sum+=v; s.genres[g].c++; } });
      });
      DATA.members.forEach((x,i)=>{
        const v = vals[i];
        if (v==null) return;
        const mm = s.byMember[x.id];
        mm.scores.push(v); mm.count++;
        if (bom.pages) mm.pages += bom.pages;
        if (!mm.best || v>mm.best.score) mm.best = {title:bom.title, score:v};
      });
      const pk = bom.pickedBy===MUTUAL ? s.mutual : s.picks[bom.pickedBy];
      if (bom.pickedBy && pk){
        const got = vals.filter(v=>v!=null);
        const room = got.reduce((a,c)=>a+c,0)/got.length;
        pk.n++; pk.room.push(room);
        const entry = {title:bom.title, month:m.name, room:room};
        if (!pk.best  || room > pk.best.room)  pk.best  = entry;
        if (!pk.worst || room < pk.worst.room) pk.worst = entry;
      }
      if (vals.length===2 && vals[0]!=null && vals[1]!=null){
        s.gaps.push({title:bom.title, month:m.name, a:vals[0], b:vals[1], gap:Math.abs(vals[0]-vals[1])});
        const gr = num(bom.goodreads);
        if (gr!=null) s.grDelta.push(((vals[0]+vals[1])/2) - gr);
      }
    });
    (m.top||[]).forEach(b=>{
      const v = num(b.score);
      if (v==null || !b.title) return;
      s.books++;
      if (b.pages) s.pages += b.pages;
      (b.genres||[]).forEach(g=>{
        s.genres[g] = s.genres[g] || {n:0,sum:0,c:0};
        s.genres[g].n++; s.genres[g].sum+=v; s.genres[g].c++;
      });
      const mm = s.byMember[b.member];
      if (mm){
        mm.scores.push(v); mm.count++;
        if (b.pages) mm.pages += b.pages;
        if (!mm.best || v>mm.best.score) mm.best = {title:b.title, score:v};
      }
    });
  });
  return s;
}

function renderWrapped(){
  const s = statsFor();
  const avg = a => a.length ? (a.reduce((x,y)=>x+y,0)/a.length) : null;
  const gapsSorted = s.gaps.slice().sort((a,b)=>b.gap-a.gap);
  const worst = gapsSorted[0], closest = gapsSorted[gapsSorted.length-1];
  const genres = Object.entries(s.genres).sort((a,b)=>b[1].n-a[1].n).slice(0,6);
  const grAvg = avg(s.grDelta);

  let html = '<div class="sheet-bar"><button class="btn ghost" data-act="close">← All months</button></div>'+
    '<h2 class="sheet-month">'+YEAR+' Wrapped</h2>'+
    '<p class="empty-note">'+(DATA.club.zodiac||'')+' · everything you two have scored so far.</p>';

  html += '<div class="section-label">The numbers</div><div class="big-grid">'+
    '<div class="bignum"><span class="n">'+s.books+'</span><span class="l">books scored</span></div>'+
    '<div class="bignum"><span class="n">'+(s.pages?s.pages.toLocaleString():'—')+'</span><span class="l">pages read</span></div>'+
    DATA.members.map(x=>{
      const a = avg(s.byMember[x.id].scores);
      return '<div class="bignum"><span class="n" style="color:'+readerColor(x.id)+'">'+
        (a==null?'—':a.toFixed(2))+'</span><span class="l">'+esc(memberLabel(x.id))+' average</span></div>';
    }).join('')+'</div>';

  if (!s.books){
    html += '<p class="empty-note" style="margin-top:2rem">Nothing scored in '+YEAR+
      ' yet — this fills in as you go.</p>';
    $('#sheet-inner').innerHTML = html;
    wireSimpleSheet(); return;
  }

  html += '<div class="section-label">Where you disagreed</div><div class="duel">';
  if (worst && worst.gap>0){
    html += '<div class="duel-card"><h5>Biggest split · '+esc(worst.month)+'</h5>'+
      '<p class="bt">'+esc(worst.title)+'</p>'+
      DATA.members.map((x,i)=>'<div class="duel-row"><span style="color:'+readerColor(x.id)+'">'+
        esc(memberLabel(x.id))+'</span><span>'+(i===0?worst.a:worst.b)+'/5</span></div>').join('')+
      '<div class="duel-row"><span>Gap</span><span>'+worst.gap.toFixed(2)+' points</span></div></div>';
  }
  if (closest && closest!==worst){
    html += '<div class="duel-card"><h5>Most agreed · '+esc(closest.month)+'</h5>'+
      '<p class="bt">'+esc(closest.title)+'</p>'+
      DATA.members.map((x,i)=>'<div class="duel-row"><span style="color:'+readerColor(x.id)+'">'+
        esc(memberLabel(x.id))+'</span><span>'+(i===0?closest.a:closest.b)+'/5</span></div>').join('')+
      '<div class="duel-row"><span>Gap</span><span>'+closest.gap.toFixed(2)+' points</span></div></div>';
  }
  html += '</div>';

  html += '<div class="section-label">Each of you</div><div class="duel">'+
    DATA.members.map(x=>{
      const mm = s.byMember[x.id], a = avg(mm.scores);
      return '<div class="duel-card"><h5 style="color:'+readerColor(x.id)+'">'+esc(memberLabel(x.id))+'</h5>'+
        '<div class="duel-row"><span>Books scored</span><span>'+mm.count+'</span></div>'+
        '<div class="duel-row"><span>Average</span><span>'+(a==null?'—':a.toFixed(2))+'/5</span></div>'+
        '<div class="duel-row"><span>Pages</span><span>'+(mm.pages?mm.pages.toLocaleString():'—')+'</span></div>'+
        (mm.best?'<div class="duel-row"><span>Loved most</span><span>'+esc(mm.best.title)+' · '+mm.best.score+'</span></div>':'')+
        '</div>';
    }).join('')+'</div>';

  // one card of pick stats; used for each of you and for the picks you made together
  const pickCard = (title, color, pk) => {
    const a = avg(pk.room);
    return '<div class="duel-card"><h5 style="color:'+color+'">'+title+'</h5>'+
      '<div class="duel-row"><span>Books chosen</span><span>'+pk.n+'</span></div>'+
      '<div class="duel-row"><span>Room average</span><span>'+(a==null?'—':a.toFixed(2))+'/5</span></div>'+
      (pk.best?'<div class="duel-row"><span>Best call</span><span>'+esc(pk.best.title)+
        ' · '+pk.best.room.toFixed(2)+'</span></div>':'')+
      (pk.worst && pk.n>1?'<div class="duel-row"><span>Worst call</span><span>'+esc(pk.worst.title)+
        ' · '+pk.worst.room.toFixed(2)+'</span></div>':'')+
      '</div>';
  };
  const pickers = DATA.members.filter(x=>s.picks[x.id].n>0);
  if (pickers.length){
    const scoreOf = id => avg(s.picks[id].room);
    const ranked = pickers.slice().sort((a,b)=>scoreOf(b.id)-scoreOf(a.id));
    const lead = ranked[0], gap = ranked.length>1 ? (scoreOf(ranked[0].id)-scoreOf(ranked[1].id)) : 0;
    html += '<div class="section-label">Who picks better</div>';
    if (ranked.length>1){
      html += '<div class="duel-card" style="margin-bottom:1rem">'+
        '<p class="bt" style="color:'+readerColor(lead.id)+'">'+
        (gap<0.05 ? 'Dead heat' : esc(member(lead.id).name)+' is winning')+'</p>'+
        '<p class="empty-note">'+(gap<0.05
          ? 'Your picks are averaging within a rounding error of each other.'
          : esc(member(lead.id).name)+"'s picks average "+gap.toFixed(2)+
            ' points higher across the room.')+'</p></div>';
    }
    html += '<div class="duel">'+ pickers.map(x=>
      pickCard(esc(memberLabel(x.id))+"'s picks", readerColor(x.id), s.picks[x.id])).join('')+
      (s.mutual.n ? pickCard('Mutual picks', 'var(--gold)', s.mutual) : '')+'</div>';
  } else {
    html += '<div class="section-label">Who picks better</div>'+
      (s.mutual.n ? '<div class="duel">'+pickCard('Mutual picks', 'var(--gold)', s.mutual)+'</div>'
        : '<p class="empty-note">No picks attributed yet. Open a month, hit edit, and set '+
          '“Whose pick” on the book of the month — the tally builds from there.</p>');
  }

  if (genres.length){
    html += '<div class="section-label">What you actually read</div>';
    const top = genres[0][1].n;
    html += genres.map(([g,v])=>{
      const a = v.c ? (v.sum/v.c) : null;
      return '<div class="genre-row"><span class="gn">'+esc(g)+
        '<div class="bar"><i style="width:'+Math.round(v.n/top*100)+'%"></i></div></span>'+
        '<span class="gc">'+v.n+' book'+(v.n>1?'s':'')+(a?' · '+a.toFixed(1)+'/5':'')+'</span></div>';
    }).join('');
  }

  if (grAvg!=null){
    const harsher = grAvg < 0;
    html += '<div class="section-label">You vs everyone else</div>'+
      '<div class="duel-card"><p class="bt">'+(harsher?'Harsher':'Softer')+' than Goodreads</p>'+
      '<p class="empty-note">On books of the month, your average sits '+
      Math.abs(grAvg).toFixed(2)+' points '+(harsher?'below':'above')+
      ' the Goodreads score. Across '+s.grDelta.length+' book'+(s.grDelta.length>1?'s':'')+'.</p></div>';
  }

  html += '<div class="section-label">Missing data?</div>'+
   
    '<button class="btn" data-act="enrich">Fill in book details</button>';

  $('#sheet-inner').innerHTML = html;
  wireSimpleSheet();
  $('#sheet').scrollTop = 0;
}

/* ================= shared sheet wiring ================= */
function wireSimpleSheet(){
  $('#sheet-inner').querySelectorAll('[data-act]').forEach(btn=>btn.addEventListener('click',()=>{
    if (btn.dataset.act==='close') return closeSheet();
    if (btn.dataset.act==='enrich') enrichBooks({announce:true});
  }));
}

$('#scrim').addEventListener('click',()=>{ closeSheet(); closePanel(); });
document.addEventListener('keydown',e=>{
  if (e.key!=='Escape') return;
  if ($('#more').open){ $('#more').open = false; return; }
  if ($('#panel').classList.contains('open')) return closePanel();
  if (view) closeSheet();
});

/* ================= theme ================= */
let themeMonth = -1;      // which month's colours are on screen right now (0 = January)

// The colours in force: this month's set, unless the switch in the Colors panel is off.
function activeTheme(){
  if (DATA && DATA.themeMode==='fixed' && DATA.theme) return DATA.theme;
  return MONTH_THEMES[new Date().getMonth()].colors;
}

// Button text has to stay readable whatever colour sits behind it, including colours you
// pick yourself. This measures how light a colour is and answers "dark text or white?".
function luminance(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex||'').trim());
  if (!m) return 0;
  const n = parseInt(m[1],16);
  const lin = v => { v/=255; return v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); };
  return .2126*lin(n>>16&255) + .7152*lin(n>>8&255) + .0722*lin(n&255);
}
function onColor(hex){
  const L = luminance(hex), ink = '#14100e';
  return (1.05/(L+.05)) >= ((L+.05)/(luminance(ink)+.05)) ? '#ffffff' : ink;
}

function applyTheme(){
  const t = activeTheme(), root = document.documentElement.style;
  Object.entries(t).forEach(([k,v])=>root.setProperty(k,v));
  root.setProperty('--on-accent', onColor(t['--accent']));
  root.setProperty('--on-gold',   onColor(t['--gold']));
  root.setProperty('--on-a',      onColor(t['--reader-a']));
  root.setProperty('--on-b',      onColor(t['--reader-b']));
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t['--bg']);
  themeMonth = new Date().getMonth();
}

function buildPanel(){
  if ($('#presets').dataset.built) return;
  $('#presets').dataset.built = '1';
  const swatches = t => '<span class="swatches">'+['--bg','--accent','--gold','--reader-b'].map(k=>
    '<i style="background:'+t[k]+'"></i>').join('')+'</span>';
  $('#month-presets').innerHTML = MONTH_THEMES.map((t,i)=>
    '<button class="preset" data-month-theme="'+i+'" aria-pressed="false">'+swatches(t.colors)+
    esc(MONTHS[i])+'<small>'+esc(t.name)+'</small></button>').join('');
  $('#presets').innerHTML = Object.entries(PRESETS).map(([n,t])=>
    '<button class="preset" data-preset="'+esc(n)+'" aria-pressed="false">'+swatches(t)+esc(n)+'</button>').join('');

  const refresh = save => { applyTheme(); syncPanelInputs(); render(); if(view) renderSheet(); if(save) queueSave(); };
  // choosing any set pins it: the switch goes off and the colours stay put
  const pin = colors => { DATA.theme = Object.assign({}, colors); DATA.themeMode = 'fixed'; refresh(true); };
  $('#month-presets').querySelectorAll('[data-month-theme]').forEach(b=>b.addEventListener('click',()=>
    pin(MONTH_THEMES[Number(b.dataset.monthTheme)].colors)));
  $('#presets').querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>
    pin(PRESETS[b.dataset.preset])));
  $('#auto-theme').addEventListener('change', e=>{
    DATA.themeMode = e.target.checked ? 'auto' : 'fixed';
    refresh(true);
  });

  // changing one colour yourself starts from whatever is showing, then pins the result
  const startOwn = () => {
    if (DATA.themeMode!=='fixed'){ DATA.theme = Object.assign({}, activeTheme()); DATA.themeMode = 'fixed'; }
  };
  $('#color-rows').innerHTML = THEME_KEYS.map(([k,l],i)=>{
    const who = i>=6 && DATA.members[i-6] ? DATA.members[i-6].name : l;
    return '<div class="color-row"><label for="c'+k+'">'+esc(who)+'</label>'+
      '<input type="color" id="c'+k+'" data-var="'+k+'"></div>';
  }).join('');
  $('#color-rows').querySelectorAll('input[type=color]').forEach(inp=>{
    inp.addEventListener('input',()=>{
      startOwn();
      DATA.theme[inp.dataset.var]=inp.value;
      applyTheme(); paintPanelState(); render(); if(view) renderSheet();
    });
    inp.addEventListener('change', queueSave);
  });
  $('#radius').addEventListener('input',e=>{
    startOwn(); DATA.theme['--radius']=e.target.value+'px'; applyTheme(); paintPanelState();
  });
  $('#radius').addEventListener('change', queueSave);
}

// the switch, the sentence under it, and which set is outlined
function paintPanelState(){
  const t = activeTheme(), auto = DATA.themeMode!=='fixed', mi = new Date().getMonth();
  $('#auto-theme').checked = auto;
  $('#theme-now').textContent = auto
    ? 'On. Showing '+MONTHS[mi]+"'s colors ("+MONTH_THEMES[mi].name+'); they switch by themselves on the 1st of each month.'
    : 'Off. The site stays on the colors below until you turn this back on.';
  const same = (a,b) => THEME_KEYS.every(([k])=>String(a[k]).toLowerCase()===String(b[k]).toLowerCase());
  document.querySelectorAll('[data-month-theme]').forEach(b=>{
    const i = Number(b.dataset.monthTheme);
    b.setAttribute('aria-pressed', String(auto ? i===mi : same(t, MONTH_THEMES[i].colors)));
  });
  document.querySelectorAll('[data-preset]').forEach(b=>
    b.setAttribute('aria-pressed', String(!auto && same(t, PRESETS[b.dataset.preset]))));
}
function syncPanelInputs(){
  if (!DATA || !$('#presets').dataset.built) return;
  const t = activeTheme();
  THEME_KEYS.forEach(([k])=>{
    const i=$('#color-rows input[data-var="'+k+'"]');
    if (i && t[k]) i.value=t[k];
  });
  $('#radius').value = parseInt(t['--radius']||'2',10);
  paintPanelState();
}
function closePanel(){
  $('#panel').classList.remove('open');
  if(!view) $('#scrim').classList.remove('open','thin');
}
$('#btn-settings').addEventListener('click',()=>{
  // "thin" makes the backdrop see-through, so you can watch the page change as you pick
  $('#panel').classList.add('open'); $('#scrim').classList.add('open','thin'); $('#panel-close').focus();
});
$('#panel-close').addEventListener('click', closePanel);

/* ================= toolbar ================= */
const moreMenu = $('#more');
moreMenu.addEventListener('click', e=>{ if (e.target.closest('.menu-list button')) moreMenu.open = false; });
document.addEventListener('click', e=>{ if (moreMenu.open && !moreMenu.contains(e.target)) moreMenu.open = false; });
$('#btn-wrapped').addEventListener('click',()=>openSheet('wrapped'));
$('#btn-wrapped-m').addEventListener('click',()=>openSheet('wrapped'));
$('#btn-covers').addEventListener('click',()=>enrichBooks({announce:true}));
$('#yr-prev').addEventListener('click',()=>loadYear(YEAR-1));
$('#yr-next').addEventListener('click',()=>loadYear(YEAR+1));

$('#btn-export').addEventListener('click',()=>{
  // the year's data, plus a copy of the TBR for safe keeping
  const blob = new Blob([JSON.stringify(Object.assign({}, DATA, {tbr: TBR.items}),null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='bookclub-'+YEAR+'-backup.json'; a.click();
  URL.revokeObjectURL(a.href); toast('Backup downloaded');
});
$('#btn-import').addEventListener('click',()=>$('#file-input').click());
$('#file-input').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const next=JSON.parse(r.result);
      if(!next.months) throw new Error('bad file');
      // the TBR copy is not part of a year, so take it out before the year is restored;
      // it is only put back if the TBR is empty right now (so a restore never wipes newer plans)
      const savedTbr = next.tbr; delete next.tbr;
      DATA = migrate(next);
      if (Array.isArray(savedTbr) && savedTbr.length && !TBR.items.length){ TBR = tidyTbr({items:savedTbr}); saveTbr(); }
      applyTheme(); syncPanelInputs(); render(); queueSave(); toast('Backup restored');
    }catch(err){ toast("That file isn't book club JSON"); }
  };
  r.readAsText(f); e.target.value='';
});

/* ================= boot ================= */
(function boot(){
  applyTheme();                 // this month's colours, before the data has even loaded
  initSync();
  setInterval(()=>{
    if (!DATA) return;
    paintLastEdit();
    // left open over midnight on the last day of a month: switch to the new month's colours
    if (themeMonth !== new Date().getMonth()){ applyTheme(); syncPanelInputs(); render(); }
  }, 60000);
})();
</script>
