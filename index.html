     3. Authentication > Get started > Sign-in method > enable Anonymous

          rules_version = '2';
          service cloud.firestore {
            match /databases/{database}/documents {
              match /bookclub/{docId} {
                allow read: if request.auth != null;
                allow create, update: if request.auth != null
                                      && request.resource.data.months is list

                allow delete: if false;

<style>
:root{
  --bg:#16100e; --fg:#f0e6d6; --card:#efe3d0; --card-fg:#1a1310;
  --accent:#d6291e; --gold:#e5a93c; --reader-a:#d6291e; --reader-b:#2e7d64;
  --radius:2px;
  --bg-2: color-mix(in srgb, var(--bg) 88%, var(--fg));
  --fg-dim: color-mix(in srgb, var(--fg) 55%, var(--bg));
  --card-dim: color-mix(in srgb, var(--card-fg) 55%, var(--card));
  --rule: color-mix(in srgb, var(--fg) 22%, transparent);
  --display:"Big Shoulders Display","Haettenschweiler","Arial Narrow",sans-serif;
  --body:"Literata",Georgia,"Times New Roman",serif;
  --mono:"Space Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;
  line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  padding-bottom:calc(5rem + env(safe-area-inset-bottom))}
body.locked{overflow:hidden}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px}
img{display:block;max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(1rem,4vw,2.5rem)}

.statusbar{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1.25rem;padding:.7rem 0;
  border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:.66rem;
  letter-spacing:.12em;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fg-dim);display:inline-block;
  margin-right:.5rem;vertical-align:middle}
.dot.live{background:#3fbf6b}.dot.saving{background:var(--gold)}.dot.err{background:var(--accent)}
.status{color:var(--fg-dim)}
.who-pick{display:flex;gap:.35rem;margin-left:auto;align-items:center;flex-wrap:wrap}
.who-pick > span{color:var(--fg-dim)}
.chip{padding:.3rem .65rem;border:1px solid var(--rule);border-radius:99px;font-family:var(--mono);
  font-size:.62rem;letter-spacing:.12em;text-transform:uppercase}
.chip[aria-pressed=true]{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff}

.masthead{padding:clamp(2rem,6vw,4rem) 0 1.75rem}
.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1}
.sheet-inner{position:relative;z-index:1}
.sky .df{position:absolute;left:0;width:54px;color:var(--gold);opacity:.15;
  will-change:transform;animation:drift 58s linear infinite}
.sky .df ellipse,.sky .df rect,.sky .df path{fill:currentColor}
.sky .df .w{transform-box:view-box;transform-origin:50px 20px;
  animation:hoverwing 2.4s ease-in-out infinite}
.sky .df.a{top:7%}
.sky .df.b{top:27%;width:34px;opacity:.10;animation-duration:82s;animation-delay:-30s}
.sky .df.c{top:49%;width:68px;opacity:.13;animation-duration:47s;animation-delay:-14s}
.sky .df.d{top:68%;width:44px;opacity:.11;animation-duration:71s;animation-delay:-52s}
.sky .df.e{top:86%;width:58px;opacity:.14;animation-duration:63s;animation-delay:-38s}
.sky-sheet .df{opacity:.09}
@keyframes drift{
  0%  {transform:translate3d(-110px,0,0) rotate(6deg)}
  25% {transform:translate3d(28vw,-18px,0) rotate(-5deg)}
  50% {transform:translate3d(54vw,13px,0) rotate(9deg)}
  75% {transform:translate3d(80vw,-10px,0) rotate(-4deg)}
  100%{transform:translate3d(calc(100vw + 110px),0,0) rotate(5deg)}
}
@keyframes hoverwing{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.7)}}
.eyebrow{display:flex;align-items:center;gap:.6rem;font-family:var(--mono);font-size:.7rem;
  letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:1rem}
.eyebrow .line{flex:1;height:1px;background:var(--rule)}
.yr{border:1px solid var(--rule);border-radius:var(--radius);width:1.7rem;height:1.7rem;
  display:inline-flex;align-items:center;justify-content:center;color:var(--gold);line-height:1}
.yr:hover{border-color:var(--gold)}
.yr[disabled]{opacity:.3;cursor:default}
h1.title{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,9.5vw,6.5rem);
  line-height:.86;letter-spacing:-.01em;text-transform:uppercase;margin:0}
h1.title em{font-style:normal;color:var(--accent)}
.colophon{display:flex;flex-wrap:wrap;gap:.4rem 1.5rem;margin-top:1.4rem;padding-top:1rem;
  border-top:1px solid var(--rule);font-family:var(--mono);font-size:.72rem;
  letter-spacing:.06em;color:var(--fg-dim)}
.colophon b{color:var(--fg);font-weight:700}
.toolbar{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.5rem}
.btn{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
  padding:.6rem 1rem;border:1px solid var(--rule);border-radius:var(--radius);color:var(--fg);
  transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--bg-2);border-color:var(--fg-dim)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.12)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#14100e}
.btn.ghost{border-color:transparent;color:var(--fg-dim)}
.btn.ghost:hover{color:var(--fg)}

.grid{display:grid;gap:clamp(1rem,2.5vw,1.75rem);
  grid-template-columns:repeat(auto-fill,minmax(215px,1fr));margin-top:.5rem}
.card{position:relative;text-align:left;width:100%;background:var(--card);color:var(--card-fg);
  border-radius:var(--radius);padding:0 0 1rem;overflow:hidden;
  transition:transform .18s ease,box-shadow .18s ease}
.card:hover,.card:focus-visible{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--accent)}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;
  padding:.7rem .9rem .55rem;border-bottom:1px solid color-mix(in srgb,var(--card-fg) 18%,transparent)}
.card-month{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1.5rem;line-height:1}
.card-kind{font-family:var(--mono);font-size:.55rem;letter-spacing:.16em;text-transform:uppercase;color:var(--card-dim)}
.cover-slot{position:relative;margin:1rem .9rem .85rem;aspect-ratio:2/3;
  background:color-mix(in srgb,var(--card-fg) 8%,transparent);border-radius:1px;overflow:hidden}
.cover-slot img{width:100%;height:100%;object-fit:cover}
.cover-fallback{position:absolute;inset:0;display:flex;align-items:flex-end;padding:.75rem;
  font-family:var(--display);font-weight:600;text-transform:uppercase;font-size:1rem;line-height:1.05;
  color:var(--card-dim);--vein:color-mix(in srgb,var(--card-fg) 11%,transparent);
  background:
    repeating-linear-gradient(101deg, transparent 0 15px, var(--vein) 15px 15.7px),
    repeating-linear-gradient(7deg, transparent 0 10px, var(--vein) 10px 10.7px)}
.card-body{padding:0 .9rem}
.card-title{font-weight:600;font-size:.98rem;line-height:1.25;margin:0}
.card-author{font-family:var(--mono);font-size:.68rem;color:var(--card-dim);margin:.3rem 0 0}
.marks{margin-top:.8rem;display:grid;gap:0}
.markrow{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;
  font-family:var(--mono);font-size:.66rem;padding:.22rem 0;
  border-bottom:1px solid color-mix(in srgb,var(--card-fg) 12%,transparent)}
.markrow:last-child{border-bottom:none}
.markrow .who{color:var(--mc,var(--card-dim));letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.markrow .val{font-weight:700;color:var(--mc,var(--card-fg));white-space:nowrap}
.markrow.avg .who,.markrow.avg .val{color:var(--card-dim);font-weight:400}
.markrow .val.none{opacity:.35;font-weight:400}
.stamp{position:absolute;top:.55rem;right:.6rem;transform:rotate(-9deg);font-family:var(--mono);
  font-weight:700;font-size:.58rem;letter-spacing:.18em;padding:.25rem .5rem;border:2px solid var(--gold);
  color:var(--gold);border-radius:2px;opacity:.85;pointer-events:none}
.card.pending .cover-slot{opacity:.55}
.card.now::after{content:"";position:absolute;inset:0;border:2px solid var(--accent);
  border-radius:var(--radius);pointer-events:none;z-index:1}
.card.now .card-kind{color:var(--accent)}
.card.now.pending .cover-slot{opacity:1}
.stamp.now{border-color:var(--accent);color:var(--accent);transform:rotate(-4deg);opacity:1}
.stamp.past{border-color:var(--card-dim);color:var(--card-dim);opacity:.7}

.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 82%,#000);
  backdrop-filter:blur(3px);z-index:40;display:none}
.scrim.open{display:block}
.sheet{position:fixed;inset:0;z-index:50;overflow-y:auto;display:none;animation:rise .22s ease-out}
.sheet.open{display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sheet-inner{max-width:960px;margin:0 auto;padding:clamp(1rem,4vw,3rem) clamp(1rem,4vw,2.5rem) 6rem}
.sheet-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;
  gap:1rem;padding:.9rem 0 1rem;margin-bottom:1.5rem;background:linear-gradient(var(--bg) 72%,transparent)}
.sheet-month{font-family:var(--display);font-weight:800;text-transform:uppercase;
  font-size:clamp(2.4rem,8vw,4.5rem);line-height:.85;margin:0 0 .4rem}
.section-label{font-family:var(--mono);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold);display:flex;align-items:center;gap:.9rem;margin:2.75rem 0 1.25rem}
.section-label::after{content:"";flex:1;height:1px;background:var(--rule)}
.bom{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:clamp(1.25rem,4vw,2.5rem);align-items:start}
.bom .cover-slot{margin:0;background:var(--bg-2)}
.bom .cover-fallback{color:var(--fg-dim);--vein:color-mix(in srgb,var(--fg) 13%,transparent)}
.book-title{font-family:var(--display);font-weight:600;text-transform:uppercase;
  font-size:clamp(1.5rem,4vw,2.4rem);line-height:.98;margin:0}
.book-author{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;color:var(--fg-dim);margin:.55rem 0 0}
.tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.7rem}
.tag{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
  padding:.18rem .45rem;border:1px solid var(--rule);border-radius:99px;color:var(--fg-dim)}
.scoreline{display:flex;flex-wrap:wrap;gap:1.75rem;margin:1.5rem 0 0;padding:1rem 0;border-block:1px solid var(--rule)}
.score{display:flex;flex-direction:column;gap:.2rem}
.score .lab{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-dim)}
.score .val{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1}
.score .val small{font-family:var(--mono);font-size:.7rem;font-weight:400;color:var(--fg-dim);margin-left:.15rem}
.score.empty .val{color:var(--fg-dim);opacity:.5}
.quotes{display:grid;gap:1.1rem;margin-top:1.75rem}
.qgroup{display:grid;gap:.7rem}
.quote{position:relative;padding:.15rem 0 .15rem 1.4rem;border-left:3px solid var(--qc,var(--accent))}
.quote p{margin:0;font-size:clamp(1rem,2.2vw,1.18rem);line-height:1.55;font-style:italic}
.quote .attr{display:block;margin-top:.6rem;font-family:var(--mono);font-style:normal;font-size:.65rem;
  letter-spacing:.16em;text-transform:uppercase;color:var(--qc,var(--accent))}
.quote.empty p{color:var(--fg-dim);opacity:.6;font-style:normal;font-family:var(--mono);font-size:.8rem}
.tops{display:grid;gap:1.5rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.top{display:grid;grid-template-columns:78px minmax(0,1fr);gap:1rem;align-items:start;
  padding-top:1rem;border-top:2px solid var(--qc,var(--accent))}
.top .cover-slot{margin:0;background:var(--bg-2)}
.top .cover-fallback{font-size:.7rem;padding:.4rem;color:var(--fg-dim);--vein:color-mix(in srgb,var(--fg) 13%,transparent)}
.top-who{font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--qc);margin:0 0 .35rem}
.top-title{font-weight:600;font-size:1.05rem;line-height:1.25;margin:0}
.top-meta{font-family:var(--mono);font-size:.68rem;color:var(--fg-dim);margin:.35rem 0 0}
.top .quote{margin-top:.7rem;border-left-width:2px;padding-left:.9rem}
.top .quote p{font-size:.92rem}

.field{display:block;margin-bottom:.85rem}
.field > span{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--fg-dim);margin-bottom:.35rem}
input[type=text],input[type=number],input[type=url],textarea,select{width:100%;background:var(--bg-2);
  color:var(--fg);border:1px solid var(--rule);border-radius:var(--radius);padding:.55rem .7rem;
  font-family:var(--body);font-size:.92rem}
textarea{resize:vertical;min-height:4rem;font-style:italic}
input:focus,textarea:focus,select:focus{border-color:var(--gold);outline:none}
.field.mine input,.field.mine textarea{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 7%,var(--bg-2))}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.85rem}
.edit-block{border:1px solid var(--rule);border-radius:var(--radius);padding:1.1rem;margin-bottom:1rem;
  background:color-mix(in srgb,var(--bg) 94%,var(--fg))}
.edit-block-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.9rem}
.edit-block-head h4{font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
  margin:0;color:var(--gold)}
.cover-row{display:flex;gap:.5rem;align-items:flex-end;flex-wrap:wrap}
.cover-row .field{flex:1;min-width:180px;margin-bottom:0}
.cover-picks{margin-top:.9rem;padding:.9rem;border:1px dashed var(--rule);border-radius:var(--radius)}
.picks-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.75rem;
  font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-dim)}
.picks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:.6rem}
.pick{padding:0;border:2px solid transparent;border-radius:2px;overflow:hidden;background:var(--bg-2);display:block;text-align:left}
.pick img{width:100%;aspect-ratio:2/3;object-fit:cover}
.pick:hover{border-color:var(--fg-dim)}
.pick.on{border-color:var(--gold)}
.pick span{display:block;font-family:var(--mono);font-size:.5rem;line-height:1.35;padding:.3rem;
  color:var(--fg-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{color:var(--gold);text-decoration:underline;text-underline-offset:3px;font-family:var(--mono);
  font-size:.68rem;letter-spacing:.1em;text-transform:uppercase}
.empty-note{font-family:var(--mono);font-size:.75rem;color:var(--fg-dim);margin:0}
.qedit{display:flex;gap:.5rem;align-items:flex-start;margin-bottom:.5rem}
.qedit textarea{flex:1}
.qedit button{margin-top:.15rem}

/* wrapped */
.big-grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.bignum{border:1px solid var(--rule);border-radius:var(--radius);padding:1.1rem}
.bignum .n{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,6vw,3.4rem);
  line-height:.9;display:block;color:var(--gold)}
.bignum .l{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--fg-dim);display:block;margin-top:.5rem}
.duel{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.duel-card{border:1px solid var(--rule);border-radius:var(--radius);padding:1.1rem}
.duel-card h5{font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);margin:0 0 .7rem}
.duel-card .bt{font-family:var(--display);font-weight:600;text-transform:uppercase;font-size:1.35rem;
  line-height:1;margin:0 0 .6rem}
.duel-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.72rem;
  padding:.25rem 0;border-bottom:1px solid var(--rule)}
.duel-row:last-child{border-bottom:none}
.bar{height:6px;border-radius:99px;background:var(--bg-2);overflow:hidden;margin-top:.3rem}
.bar i{display:block;height:100%;background:var(--gold)}
.genre-row{display:flex;align-items:center;gap:.8rem;padding:.4rem 0;border-bottom:1px solid var(--rule);
  font-family:var(--mono);font-size:.72rem}
.genre-row .gn{flex:1}
.genre-row .gc{color:var(--fg-dim)}

/* roulette */
.reel{position:relative;overflow:hidden;border:2px solid var(--gold);border-radius:var(--radius);
  padding:5rem clamp(1.5rem,5vw,2.5rem) clamp(1.5rem,5vw,2.5rem);
  text-align:center;margin-bottom:1.5rem;min-height:8rem;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;gap:.5rem}
.dfly{position:absolute;top:10px;left:50%;width:76px;height:46px;margin-left:-38px;
  color:var(--gold);opacity:.9;pointer-events:none;
  transition:transform .5s cubic-bezier(.34,1.35,.5,1)}
.reel.spinning .dfly{transition:transform .11s ease-out}
.dfly ellipse,.dfly rect,.dfly path{fill:currentColor}
.dfly .w{transform-box:view-box;transform-origin:50px 20px;
  animation:flutter .085s infinite alternate ease-in-out;animation-play-state:paused}
.reel.spinning .dfly .w{animation-play-state:running}
@keyframes flutter{from{transform:scaleY(1)}to{transform:scaleY(.4)}}
.reel .rt{font-family:var(--display);font-weight:800;text-transform:uppercase;
  font-size:clamp(1.6rem,6vw,3rem);line-height:.95;margin:0}
.reel .ra{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;color:var(--fg-dim);margin:0}
.reel.spinning .rt{color:var(--gold)}
.queue{display:grid;gap:.5rem;margin-bottom:1.25rem}
.qrow{display:flex;align-items:center;gap:.75rem;padding:.6rem .8rem;border:1px solid var(--rule);
  border-radius:var(--radius)}
.qrow.hot{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 8%,transparent)}
.qrow .qt{flex:1;font-size:.95rem}
.qrow .qa{font-family:var(--mono);font-size:.65rem;color:var(--fg-dim)}
.qrow .qw{font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--qc)}

.panel{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);z-index:60;background:var(--bg);
  border-left:1px solid var(--rule);overflow-y:auto;padding:1.5rem 1.5rem 4rem;
  transform:translateX(101%);transition:transform .24s ease}
.panel.open{transform:none;box-shadow:-24px 0 60px rgba(0,0,0,.45)}
.panel h3{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1.8rem;margin:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:.5rem;margin-bottom:1.75rem}
.preset{border:1px solid var(--rule);border-radius:var(--radius);padding:.55rem;text-align:left;
  font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase}
.preset:hover{border-color:var(--gold)}
.swatches{display:flex;gap:3px;margin-bottom:.45rem}
.swatches i{width:14px;height:14px;border-radius:1px;display:block}
.color-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.55rem 0;
  border-bottom:1px solid var(--rule)}
.color-row label{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;color:var(--fg-dim)}
.color-row input[type=color]{width:44px;height:28px;padding:0;border:1px solid var(--rule);
  border-radius:var(--radius);background:none;cursor:pointer}
.panel-note{font-family:var(--mono);font-size:.65rem;line-height:1.7;color:var(--fg-dim);
  margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--rule)}
.toast{position:fixed;left:50%;bottom:1.5rem;transform:translate(-50%,140%);z-index:80;
  background:var(--gold);color:#14100e;padding:.65rem 1.1rem;border-radius:var(--radius);
  font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
  transition:transform .25s ease;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
@media (max-width:640px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:.8rem}
  .card{padding-bottom:.75rem}
  .card-head{padding:.55rem .6rem .45rem}
  .card-month{font-size:1.15rem}
  .card-kind{font-size:.5rem;letter-spacing:.1em}
  .cover-slot{margin:.6rem .6rem .6rem}
  .card-body{padding:0 .6rem}
  .card-title{font-size:.85rem}
  .card-author{font-size:.6rem}
  .markrow{font-size:.6rem;padding:.18rem 0}
  .stamp{font-size:.5rem;padding:.2rem .35rem;letter-spacing:.12em}

  .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
  .btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;
    text-align:center;padding:.6rem .7rem;font-size:.62rem;letter-spacing:.1em}
  .chip{min-height:38px;display:inline-flex;align-items:center;padding:.3rem .8rem}
  .yr{width:40px;height:40px;font-size:1.1rem}
  .who-pick{margin-left:0;width:100%}
  .statusbar{gap:.5rem .9rem;font-size:.6rem}

  .masthead{padding:1.75rem 0 1.25rem}
  .colophon{gap:.3rem 1rem;font-size:.65rem}

  .sheet-inner{padding:.75rem 1rem 5rem}
  .sheet-bar{padding:.7rem 0 .8rem;margin-bottom:1rem}
  .bom{grid-template-columns:1fr;gap:1.25rem}
  .bom .cover-slot{max-width:150px}
  .section-label{margin:2rem 0 1rem;font-size:.6rem}
  .scoreline{gap:1.1rem;margin-top:1.1rem}
  .score .val{font-size:1.6rem}
  .quote p{font-size:.98rem}
  .top{grid-template-columns:64px minmax(0,1fr);gap:.8rem}
  .row{grid-template-columns:1fr 1fr}
  .cover-row .field{min-width:100%}
  .cover-row .btn{flex:1}

  /* 16px stops iOS zooming the page when a field is focused */
  input[type=text],input[type=number],input[type=url],textarea,select{font-size:16px}

  .big-grid{grid-template-columns:1fr 1fr;gap:.7rem}
  .bignum{padding:.85rem}
  .duel{grid-template-columns:1fr}
  .reel{padding:4.25rem 1rem 1.25rem;min-height:7rem}
  .picks-grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
  .panel{padding:1.25rem 1.25rem calc(3rem + env(safe-area-inset-bottom))}
}
@media (max-width:380px){
  .grid{grid-template-columns:1fr 1fr}
  .toolbar{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;
  transition-duration:.01ms!important}.card:hover{transform:none}
  .sky .df,.sky .df .w{animation:none!important}

<script>
/* ================= constants ================= */
const SEED = JSON.parse(document.getElementById('seed').textContent);
const MONTHS = ['January','February','March','April','May','June','July',
                'August','September','October','November','December'];
const MONTH_NO = {}; MONTHS.forEach((n,i)=>MONTH_NO[n.toLowerCase()]=i+1);
const ZODIAC = ['Rat','Ox','Tiger','Rabbit','Dragon','Snake','Horse','Goat','Monkey','Rooster','Dog','Pig'];
const zodiacFor = y => ZODIAC[(((Number(y)-4)%12)+12)%12];

const THEME_KEYS = [['--bg','Page'],['--fg','Text'],['--card','Card'],['--card-fg','Card text'],
  ['--accent','Accent'],['--gold','Highlight'],['--reader-a','Reader 1'],['--reader-b','Reader 2']];
const PRESETS = {
  'Lacquer':  {'--bg':'#16100e','--fg':'#f0e6d6','--card':'#efe3d0','--card-fg':'#1a1310','--accent':'#d6291e','--gold':'#e5a93c','--reader-a':'#d6291e','--reader-b':'#2e7d64','--radius':'2px'},
  'Newsprint':{'--bg':'#e5e0d5','--fg':'#191713','--card':'#fffdf6','--card-fg':'#191713','--accent':'#a92a1c','--gold':'#7a6a3c','--reader-a':'#a92a1c','--reader-b':'#26584a','--radius':'0px'},
  'Midnight': {'--bg':'#0d1220','--fg':'#e7ecf6','--card':'#e9ecf4','--card-fg':'#141a28','--accent':'#6c5ce7','--gold':'#f2c14e','--reader-a':'#6c5ce7','--reader-b':'#2fb8a8','--radius':'8px'},
  'Bramble':  {'--bg':'#1a0f18','--fg':'#f8e9f0','--card':'#fbedf3','--card-fg':'#25121d','--accent':'#e23e77','--gold':'#f0b45e','--reader-a':'#e23e77','--reader-b':'#8b6bd9','--radius':'12px'},
  'Jade':     {'--bg':'#0e1a16','--fg':'#e9efe6','--card':'#f0eee0','--card-fg':'#131a15','--accent':'#c6402f','--gold':'#d9b65f','--reader-a':'#c6402f','--reader-b':'#3f8f76','--radius':'2px'},
  'Dragonfly':{'--bg':'#0d1b1a','--fg':'#e6f0ea','--card':'#e9efe8','--card-fg':'#0f1c1a','--accent':'#1f9c7a','--gold':'#e0a33a','--reader-a':'#e0653f','--reader-b':'#3d7fd6','--radius':'10px'}
};

/* ================= state ================= */
let DATA = null;
let YEAR = Number(window.START_YEAR) || 2026;
let view = null;              // null | 'month' | 'wrapped' | 'roulette'
let openMonth = null, editing = false, me = null;
let FB = null, docRef = null, unsub = null, saveTimer = null;
const LOCAL = {};             // year -> data, used when Firebase is off
let spinning = false, rouletteHit = null;

const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const member = id => DATA.members.find(m=>m.id===id) || {id:id,name:id,emoji:''};
const memberLabel = id => { const m=member(id); return m.name + (m.emoji ? ' '+m.emoji : ''); };
const readerColor = id => DATA.members.findIndex(m=>m.id===id)===1 ? 'var(--reader-b)' : 'var(--reader-a)';
const fmtScore = n => (n===''||n==null||isNaN(n)) ? null : (Math.round(Number(n)*100)/100).toString();
const num = n => (n==null||n===''||isNaN(n)) ? null : Number(n);

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2400);
}
function setStatus(kind,text){ $('#status').innerHTML='<span class="dot '+kind+'"></span>'+esc(text); }

/* ================= data shape ================= */
function blankYear(y, from){
  const base = from || SEED;
  return {
    club: { name: base.club.name, year: String(y), zodiac: 'Year of the '+zodiacFor(y) },
    members: JSON.parse(JSON.stringify(base.members)),
    theme: Object.assign({}, base.theme),
    meta: { updatedBy:'', updatedAt:'' },
    backlog: [],
    months: MONTHS.map(n=>({ id:n.toLowerCase(), name:n, bom:null, top:[] }))
  };
}

/* upgrades old documents in place: single quotes -> arrays, missing fields */
function migrate(d){
  if (!d) return d;
  d.club = d.club || {name:'Book Club', year:String(YEAR), zodiac:'Year of the '+zodiacFor(YEAR)};
  if (!d.club.zodiac) d.club.zodiac = 'Year of the '+zodiacFor(d.club.year||YEAR);
  d.members = d.members || JSON.parse(JSON.stringify(SEED.members));
  d.members.forEach(m=>{ if (m.emoji==null) m.emoji=''; });
  d.theme = Object.assign({}, PRESETS.Lacquer, d.theme||{});
  d.meta = d.meta || {updatedBy:'',updatedAt:''};
  d.backlog = Array.isArray(d.backlog) ? d.backlog : [];
  d.backlog.forEach(b=>{ b.title=b.title||''; b.author=b.author||''; b.addedBy=b.addedBy||''; });
  d.months = d.months || [];
  d.months.forEach(m=>{
    m.top = Array.isArray(m.top) ? m.top : [];
    if (m.bom){
      m.bom.cover = m.bom.cover || '';
      m.bom.pages = num(m.bom.pages);
      m.bom.genres = Array.isArray(m.bom.genres) ? m.bom.genres : [];
      m.bom.scores = m.bom.scores || {};
      m.bom.pickedBy = m.bom.pickedBy || '';
      const q = m.bom.quotes || {};
      m.bom.quotes = {};
      d.members.forEach(x=>{
        const v = q[x.id];
        m.bom.quotes[x.id] = Array.isArray(v) ? v.filter(Boolean) : (v ? [v] : []);
      });
    }
    m.top.forEach(b=>{
      b.cover = b.cover || '';
      b.pages = num(b.pages);
      b.genres = Array.isArray(b.genres) ? b.genres : [];
      if (b.quote !== undefined){
        if (!Array.isArray(b.quotes)) b.quotes = b.quote ? [b.quote] : [];
        delete b.quote;
      }
      if (!Array.isArray(b.quotes)) b.quotes = [];
      b.quotes = b.quotes.filter(Boolean);
    });
  });
  return d;
}

function allBooks(d){
  const src = d || DATA, out = [];
  (src.months||[]).forEach(m=>{ if(m.bom) out.push(m.bom); (m.top||[]).forEach(b=>out.push(b)); });
  return out;
}

/* ================= sync ================= */
async function initSync(){
  const cfg = window.FIREBASE || {};
  if (!cfg.projectId){
    setStatus('', 'Not syncing — add your Firebase keys');
    LOCAL[YEAR] = migrate(JSON.parse(JSON.stringify(SEED)));
    DATA = LOCAL[YEAR];
    afterLoad();
    return;
  }
  setStatus('saving','Connecting');
  try {
    const V='https://www.gstatic.com/firebasejs/10.12.2/';
    const [app, fs, authMod] = await Promise.all([
      import(V+'firebase-app.js'),
      import(V+'firebase-firestore.js'),
      import(V+'firebase-auth.js')
    ]);
    const application = app.initializeApp(cfg);

    // Silent sign-in. Nobody sees a login screen; it just gives the browser a
    // token so the security rules can require one. If the Anonymous provider
    // isn't switched on in the Firebase console, this is where it fails.
    try {
      const a = authMod.getAuth(application);
      if (!a.currentUser) await authMod.signInAnonymously(a);
    } catch(err){
      console.warn('Anonymous sign-in failed:', err);
      setStatus('err','Turn on Anonymous sign-in in Firebase Authentication');
    }

    FB = { fs: fs, db: fs.getFirestore(application) };
    await loadYear(YEAR);
  } catch(e){
    setStatus('err','Could not reach Firebase — edits stay on this device');
    LOCAL[YEAR] = migrate(JSON.parse(JSON.stringify(SEED)));
    DATA = LOCAL[YEAR];
    afterLoad();
  }
}

async function loadYear(y){
  YEAR = Number(y);
  if (!FB){
    if (!LOCAL[YEAR]) LOCAL[YEAR] = migrate(blankYear(YEAR, DATA || SEED));
    DATA = LOCAL[YEAR];
    afterLoad();
    return;
  }
  if (unsub){ unsub(); unsub = null; }
  setStatus('saving','Loading '+YEAR);
  const fs = FB.fs;
  docRef = fs.doc(FB.db, window.COLLECTION, String(YEAR));
  try {
    const snap = await fs.getDoc(docRef);
    if (!snap.exists()){
      const fresh = (String(YEAR) === String(window.START_YEAR))
        ? migrate(JSON.parse(JSON.stringify(SEED)))
        : migrate(blankYear(YEAR, DATA || SEED));
      fresh.club.year = String(YEAR);
      await fs.setDoc(docRef, fresh);
      DATA = fresh;
    } else {
      DATA = migrate(snap.data());
    }
    afterLoad();
    unsub = fs.onSnapshot(docRef, s=>{
      if (!s.exists() || s.metadata.hasPendingWrites) return;
      if (editing || spinning) return;
      const next = s.data();
      if (!next || !next.months) return;
      DATA = migrate(next);
      applyTheme(); syncPanelInputs(); render();
      if (view) renderSheet();
      setStatus('live','All changes saved'); paintLastEdit();
    }, ()=>setStatus('err','Lost connection'));
    setStatus('live','All changes saved');
  } catch(e){
    setStatus('err','Could not load '+YEAR);
  }
}

function afterLoad(){
  applyTheme(); buildPanel(); syncPanelInputs(); buildWhoPicker(); render();
  enrichBooks();
}

async function saveNow(){
  if (!FB || !docRef) return;
  DATA.meta = { updatedBy: me||'', updatedAt: new Date().toISOString() };
  setStatus('saving','Saving');
  try { await FB.fs.setDoc(docRef, DATA); setStatus('live','All changes saved'); paintLastEdit(); }
  catch(e){ setStatus('err','Save failed — check your connection'); }
}
function queueSave(){
  if (!FB) return;
  clearTimeout(saveTimer);
  setStatus('saving','Saving');
  saveTimer = setTimeout(saveNow, 700);
}

function paintLastEdit(){
  const m = DATA.meta || {};
  if (!m.updatedAt){ $('#lastedit').textContent=''; return; }
  const who = m.updatedBy ? member(m.updatedBy).name : 'someone';
  const when = new Date(m.updatedAt), mins = Math.round((Date.now()-when)/60000);
  const ago = mins<1 ? 'just now' : mins<60 ? mins+' min ago'
    : mins<1440 ? Math.round(mins/60)+' hr ago'
    : when.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  $('#lastedit').textContent = 'Last edit by '+who+' · '+ago;
}

/* ================= book lookup ================= */
const lookupCache = new Map();
function cleanGenres(cats){
  const drop = new Set(['fiction','general','nonfiction','juvenile fiction','young adult fiction','literary']);
  const out = [];
  (cats||[]).forEach(c=>String(c).split('/').forEach(p=>{
    const t = p.trim();
    if (!t || drop.has(t.toLowerCase()) || out.includes(t)) return;
    out.push(t);
  }));
  return out.slice(0,3);
}
async function lookupBook(title, author){
  if (!title) return {covers:[],pages:null,genres:[]};
  const key = (title+'|'+(author||'')).toLowerCase();
  if (lookupCache.has(key)) return lookupCache.get(key);
  const q = encodeURIComponent([title,author].filter(Boolean).join(' '));
  const res = { covers:[], pages:null, genres:[] };
  const addCover = (u,l)=>{ if(u && !res.covers.some(c=>c.url===u)) res.covers.push({url:u,label:l||''}); };
  try {
    const j = await (await fetch('https://www.googleapis.com/books/v1/volumes?q='+q+'&maxResults=12&printType=books')).json();
    (j.items||[]).forEach(it=>{
      const vi = it.volumeInfo||{}, l = vi.imageLinks;
      if (l) addCover((l.thumbnail||l.smallThumbnail||'').replace(/^http:/,'https:')
        .replace('&edge=curl','').replace('zoom=1','zoom=3'),
        [vi.publisher||vi.title,(vi.publishedDate||'').slice(0,4)].filter(Boolean).join(' · '));
      if (!res.pages && vi.pageCount) res.pages = vi.pageCount;
      if (!res.genres.length && vi.categories) res.genres = cleanGenres(vi.categories);
    });
  } catch(e){}
  try {
    const j = await (await fetch('https://openlibrary.org/search.json?q='+q+
      '&limit=12&fields=cover_i,title,first_publish_year,number_of_pages_median,subject')).json();
    (j.docs||[]).forEach(d=>{
      if (d.cover_i) addCover('https://covers.openlibrary.org/b/id/'+d.cover_i+'-L.jpg',
        [d.title,d.first_publish_year].filter(Boolean).join(' · '));
      if (!res.pages && d.number_of_pages_median) res.pages = d.number_of_pages_median;
      if (!res.genres.length && d.subject) res.genres = cleanGenres(d.subject.slice(0,4));
    });
  } catch(e){}
  res.covers = res.covers.slice(0,12);
  lookupCache.set(key,res);
  return res;
}

async function enrichBooks(opts){
  const announce = opts && opts.announce;
  const todo = allBooks().filter(b=>b.title && (!b.cover || b.pages==null || !b.genres.length));
  if (!todo.length){ if(announce) toast('Every book already has cover, pages and genres'); return; }
  if (announce) toast('Looking up '+todo.length+' book'+(todo.length>1?'s':'')+'…');
  let changed = 0;
  for (const b of todo){
    const info = await lookupBook(b.title, b.author);
    let hit = false;
    if (!b.cover && info.covers.length){ b.cover = info.covers[0].url; hit = true; }
    if (b.pages==null && info.pages){ b.pages = info.pages; hit = true; }
    if (!b.genres.length && info.genres.length){ b.genres = info.genres; hit = true; }
    if (hit){ changed++; render(); if (view) renderSheet(); }
  }
  if (changed) queueSave();
  if (announce) toast(changed ? 'Filled in '+changed+' book'+(changed>1?'s':'') : 'Nothing new found');
}

function openSheet(kind, id){

  document.body.classList.add('locked');

function closeSheet(){
  if (editing && view==='month'){
    const m = DATA.months.find(x=>x.id===openMonth);
    if (m){ commitFields(m); queueSave(); }
  }
  view = null; openMonth = null; editing = false; spinning = false;
  $('#sheet').classList.remove('open'); $('#scrim').classList.remove('open');
  document.body.classList.remove('locked');
  render();
}

  if (view==='month') return renderMonthSheet();

/* ---------- field plumbing ---------- */
function getPath(obj, path){
  return path.split('.').reduce((o,k)=> (o==null ? o : o[k]), obj);
}
function setPath(obj, path, val){
  const p = path.split('.');
  let cur = obj;
  for (let i=0;i<p.length-1;i++){
    if (cur[p[i]]==null) cur[p[i]] = /^\d+$/.test(p[i+1]) ? [] : {};
    cur = cur[p[i]];
  }
  cur[p[p.length-1]] = val;
}
function commitFields(m){
  $('#sheet-inner').querySelectorAll('[data-f]').forEach(el=>{
    let v = el.value;
    if (el.type==='number') v = v==='' ? null : Number(v);
    setPath(m, el.dataset.f, v);
  });
  // drop empty quotes
  if (m.bom) DATA.members.forEach(x=>{
    m.bom.quotes[x.id] = (m.bom.quotes[x.id]||[]).map(s=>String(s||'').trim()).filter(Boolean);
  });
  (m.top||[]).forEach(b=>{ b.quotes = (b.quotes||[]).map(s=>String(s||'').trim()).filter(Boolean); });
}

function wireMonthSheet(m){
  const root = $('#sheet-inner');
  root.querySelectorAll('[data-act]').forEach(btn=>btn.addEventListener('click',()=>{
    const act = btn.dataset.act;
    if (editing && act!=='close') commitFields(m);
    if (act==='close') return closeSheet();
    if (act==='toggle-edit'){ editing=!editing; if(!editing) queueSave(); }
    if (act==='add-bom') m.bom = {title:'',author:'',goodreads:null,cover:'',pages:null,genres:[],
      pickedBy: me||'', scores:{}, quotes:Object.fromEntries(DATA.members.map(x=>[x.id,[]]))};
    if (act==='remove-bom') m.bom = null;
    if (act==='add-top') (m.top=m.top||[]).push({member: me||DATA.members[0].id, title:'', author:'',
      score:null, cover:'', pages:null, genres:[], quotes:[]});
    if (act==='remove-top') m.top.splice(Number(btn.dataset.i),1);
    render(); renderSheet();
  }));

  root.querySelectorAll('[data-addq]').forEach(btn=>btn.addEventListener('click',()=>{
    commitFields(m);
    const list = getPath(m, btn.dataset.addq) || [];
    list.push('');
    setPath(m, btn.dataset.addq, list);
    renderSheet();
  }));
  root.querySelectorAll('[data-delq]').forEach(btn=>btn.addEventListener('click',()=>{
    commitFields(m);
    const list = getPath(m, btn.dataset.delq) || [];
    list.splice(Number(btn.dataset.i),1);
    render(); renderSheet();
  }));
  root.querySelectorAll('[data-clear]').forEach(btn=>btn.addEventListener('click',()=>{
    commitFields(m);
    const b = getPath(m, btn.dataset.clear);
    if (b){ b.cover=''; render(); renderSheet(); }
  }));

  root.querySelectorAll('[data-find]').forEach(btn=>btn.addEventListener('click', async ()=>{
    commitFields(m);
    const path = btn.dataset.find, book = getPath(m, path);
    const box = root.querySelector('[data-picks="'+path+'"]');
    if (!book || !book.title) return toast('Add a title first');
    btn.textContent = 'Searching…';
    const info = await lookupBook(book.title, book.author);
    btn.textContent = 'Browse covers';
    if (!info.covers.length){ box.innerHTML=''; return toast('Nothing found — paste a URL instead'); }
    box.innerHTML = '<div class="cover-picks"><div class="picks-head"><span>'+info.covers.length+
      ' covers for “'+esc(book.title)+'”</span><button class="link" data-close-picks="1">Close</button></div>'+
      '<div class="picks-grid">'+info.covers.map((c,i)=>
        '<button class="pick'+(c.url===book.cover?' on':'')+'" data-i="'+i+'" title="'+esc(c.label)+'">'+
        '<img src="'+esc(c.url)+'" alt="Cover option '+(i+1)+'" loading="lazy" '+
        'onerror="this.parentNode.style.display=\'none\'">'+
        (c.label?'<span>'+esc(c.label)+'</span>':'')+'</button>').join('')+'</div></div>';
    box.querySelectorAll('.pick').forEach(p=>p.addEventListener('click',()=>{
      book.cover = info.covers[Number(p.dataset.i)].url;
      box.querySelectorAll('.pick').forEach(x=>x.classList.remove('on'));
      p.classList.add('on');
      const input = root.querySelector('[data-f="'+path+'.cover"]');
      if (input) input.value = book.cover;
      render(); queueSave(); toast('Cover set');
    }));
    box.querySelector('[data-close-picks]').addEventListener('click',()=>{ box.innerHTML=''; });
  }));
}

/* ================= wrapped ================= */
function statsFor(){
  const s = { books:0, pages:0, byMember:{}, gaps:[], genres:{}, grDelta:[], picks:{} };
  DATA.members.forEach(x=>{
    s.byMember[x.id]={scores:[],pages:0,best:null,count:0};
    s.picks[x.id]={n:0, room:[], best:null, worst:null};
  });

  DATA.months.forEach(m=>{
    if (m.bom){
      const sc = m.bom.scores||{};
      const vals = DATA.members.map(x=>num(sc[x.id]));
      const anyScored = vals.some(v=>v!=null);
      if (anyScored){
        s.books++;
        if (m.bom.pages) s.pages += m.bom.pages;
        (m.bom.genres||[]).forEach(g=>{
          s.genres[g] = s.genres[g] || {n:0, sum:0, c:0};
          s.genres[g].n++;
          vals.forEach(v=>{ if(v!=null){ s.genres[g].sum+=v; s.genres[g].c++; } });
        });
        DATA.members.forEach((x,i)=>{
          const v = vals[i];
          if (v==null) return;
          const mm = s.byMember[x.id];
          mm.scores.push(v); mm.count++;
          if (m.bom.pages) mm.pages += m.bom.pages;
          if (!mm.best || v>mm.best.score) mm.best = {title:m.bom.title, score:v};
        });
        if (m.bom.pickedBy && s.picks[m.bom.pickedBy]){
          const got = vals.filter(v=>v!=null);
          const room = got.reduce((a,c)=>a+c,0)/got.length;
          const pk = s.picks[m.bom.pickedBy];
          pk.n++; pk.room.push(room);
          const entry = {title:m.bom.title, month:m.name, room:room};
          if (!pk.best  || room > pk.best.room)  pk.best  = entry;
          if (!pk.worst || room < pk.worst.room) pk.worst = entry;
        }
        if (vals.length===2 && vals[0]!=null && vals[1]!=null){
          s.gaps.push({title:m.bom.title, month:m.name, a:vals[0], b:vals[1], gap:Math.abs(vals[0]-vals[1])});
          const gr = num(m.bom.goodreads);
          if (gr!=null) s.grDelta.push(((vals[0]+vals[1])/2) - gr);
        }
      }
    }
    (m.top||[]).forEach(b=>{
      const v = num(b.score);
      if (v==null || !b.title) return;
      s.books++;
      if (b.pages) s.pages += b.pages;
      (b.genres||[]).forEach(g=>{
        s.genres[g] = s.genres[g] || {n:0,sum:0,c:0};
        s.genres[g].n++; s.genres[g].sum+=v; s.genres[g].c++;
      });
      const mm = s.byMember[b.member];
      if (mm){
        mm.scores.push(v); mm.count++;
        if (b.pages) mm.pages += b.pages;
        if (!mm.best || v>mm.best.score) mm.best = {title:b.title, score:v};
      }
    });
  });
  return s;
}

function renderWrapped(){
  const s = statsFor();
  const avg = a => a.length ? (a.reduce((x,y)=>x+y,0)/a.length) : null;
  const gapsSorted = s.gaps.slice().sort((a,b)=>b.gap-a.gap);
  const worst = gapsSorted[0], closest = gapsSorted[gapsSorted.length-1];
  const genres = Object.entries(s.genres).sort((a,b)=>b[1].n-a[1].n).slice(0,6);
  const grAvg = avg(s.grDelta);

  let html = '<div class="sheet-bar"><button class="btn ghost" data-act="close">← All months</button></div>'+
    '<h2 class="sheet-month">'+YEAR+' Wrapped</h2>'+
    '<p class="empty-note">'+(DATA.club.zodiac||'')+' · everything you two have scored so far.</p>';

  html += '<div class="section-label">The numbers</div><div class="big-grid">'+
    '<div class="bignum"><span class="n">'+s.books+'</span><span class="l">books scored</span></div>'+
    '<div class="bignum"><span class="n">'+(s.pages?s.pages.toLocaleString():'—')+'</span><span class="l">pages read</span></div>'+
    DATA.members.map(x=>{
      const a = avg(s.byMember[x.id].scores);
      return '<div class="bignum"><span class="n" style="color:'+readerColor(x.id)+'">'+
        (a==null?'—':a.toFixed(2))+'</span><span class="l">'+esc(memberLabel(x.id))+' average</span></div>';
    }).join('')+'</div>';

  if (!s.books){
    html += '<p class="empty-note" style="margin-top:2rem">Nothing scored in '+YEAR+
      ' yet — this fills in as you go.</p>';
    $('#sheet-inner').innerHTML = html;
    wireSimpleSheet(); return;
  }

  html += '<div class="section-label">Where you disagreed</div><div class="duel">';
  if (worst && worst.gap>0){
    html += '<div class="duel-card"><h5>Biggest split · '+esc(worst.month)+'</h5>'+
      '<p class="bt">'+esc(worst.title)+'</p>'+
      DATA.members.map((x,i)=>'<div class="duel-row"><span style="color:'+readerColor(x.id)+'">'+
        esc(memberLabel(x.id))+'</span><span>'+(i===0?worst.a:worst.b)+'/5</span></div>').join('')+
      '<div class="duel-row"><span>Gap</span><span>'+worst.gap.toFixed(2)+' points</span></div></div>';
  }
  if (closest && closest!==worst){
    html += '<div class="duel-card"><h5>Most agreed · '+esc(closest.month)+'</h5>'+
      '<p class="bt">'+esc(closest.title)+'</p>'+
      DATA.members.map((x,i)=>'<div class="duel-row"><span style="color:'+readerColor(x.id)+'">'+
        esc(memberLabel(x.id))+'</span><span>'+(i===0?closest.a:closest.b)+'/5</span></div>').join('')+
      '<div class="duel-row"><span>Gap</span><span>'+closest.gap.toFixed(2)+' points</span></div></div>';
  }
  html += '</div>';

  html += '<div class="section-label">Each of you</div><div class="duel">'+
    DATA.members.map(x=>{
      const mm = s.byMember[x.id], a = avg(mm.scores);
      return '<div class="duel-card"><h5 style="color:'+readerColor(x.id)+'">'+esc(memberLabel(x.id))+'</h5>'+
        '<div class="duel-row"><span>Books scored</span><span>'+mm.count+'</span></div>'+
        '<div class="duel-row"><span>Average</span><span>'+(a==null?'—':a.toFixed(2))+'/5</span></div>'+
        '<div class="duel-row"><span>Pages</span><span>'+(mm.pages?mm.pages.toLocaleString():'—')+'</span></div>'+
        (mm.best?'<div class="duel-row"><span>Loved most</span><span>'+esc(mm.best.title)+' · '+mm.best.score+'</span></div>':'')+
        '</div>';
    }).join('')+'</div>';

  const pickers = DATA.members.filter(x=>s.picks[x.id].n>0);
  if (pickers.length){
    const scoreOf = id => avg(s.picks[id].room);
    const ranked = pickers.slice().sort((a,b)=>scoreOf(b.id)-scoreOf(a.id));
    const lead = ranked[0], gap = ranked.length>1 ? (scoreOf(ranked[0].id)-scoreOf(ranked[1].id)) : 0;
    html += '<div class="section-label">Who picks better</div>';
    if (ranked.length>1){
      html += '<div class="duel-card" style="margin-bottom:1rem">'+
        '<p class="bt" style="color:'+readerColor(lead.id)+'">'+
        (gap<0.05 ? 'Dead heat' : esc(member(lead.id).name)+' is winning')+'</p>'+
        '<p class="empty-note">'+(gap<0.05
          ? 'Your picks are averaging within a rounding error of each other.'
          : esc(member(lead.id).name)+"'s picks average "+gap.toFixed(2)+
            ' points higher across the room.')+'</p></div>';
    }
    html += '<div class="duel">'+ pickers.map(x=>{
      const pk = s.picks[x.id], a = avg(pk.room);
      return '<div class="duel-card"><h5 style="color:'+readerColor(x.id)+'">'+
        esc(memberLabel(x.id))+"'s picks</h5>"+
        '<div class="duel-row"><span>Books chosen</span><span>'+pk.n+'</span></div>'+
        '<div class="duel-row"><span>Room average</span><span>'+(a==null?'—':a.toFixed(2))+'/5</span></div>'+
        (pk.best?'<div class="duel-row"><span>Best call</span><span>'+esc(pk.best.title)+
          ' · '+pk.best.room.toFixed(2)+'</span></div>':'')+
        (pk.worst && pk.n>1?'<div class="duel-row"><span>Worst call</span><span>'+esc(pk.worst.title)+
          ' · '+pk.worst.room.toFixed(2)+'</span></div>':'')+
        '</div>';
    }).join('') +'</div>';
  } else {
    html += '<div class="section-label">Who picks better</div>'+
      '<p class="empty-note">No picks attributed yet. Open a month, hit edit, and set '+
      '“Whose pick” on the book of the month — the tally builds from there.</p>';
  }

  if (genres.length){
    html += '<div class="section-label">What you actually read</div>';
    const top = genres[0][1].n;
    html += genres.map(([g,v])=>{
      const a = v.c ? (v.sum/v.c) : null;
      return '<div class="genre-row"><span class="gn">'+esc(g)+
        '<div class="bar"><i style="width:'+Math.round(v.n/top*100)+'%"></i></div></span>'+
        '<span class="gc">'+v.n+' book'+(v.n>1?'s':'')+(a?' · '+a.toFixed(1)+'/5':'')+'</span></div>';
    }).join('');
  }

  if (grAvg!=null){
    const harsher = grAvg < 0;
    html += '<div class="section-label">You vs everyone else</div>'+
      '<div class="duel-card"><p class="bt">'+(harsher?'Harsher':'Softer')+' than Goodreads</p>'+
      '<p class="empty-note">On books of the month, your average sits '+
      Math.abs(grAvg).toFixed(2)+' points '+(harsher?'below':'above')+
      ' the Goodreads score. Across '+s.grDelta.length+' book'+(s.grDelta.length>1?'s':'')+'.</p></div>';
  }

  html += '<div class="section-label">Missing data?</div>'+
   
    '<button class="btn" data-act="enrich">Fill in book details</button>';

  $('#sheet-inner').innerHTML = html;
  wireSimpleSheet();
  $('#sheet').scrollTop = 0;
}

/* ================= roulette ================= */
const DFLY = '<svg class="dfly" id="dfly" viewBox="0 0 100 60" aria-hidden="true">'+
  '<g class="w">'+
    '<path d="M47 28 C20 18 6 22 4 29 C3 35 16 37 47 32 Z"/>'+
    '<path d="M53 28 C80 18 94 22 96 29 C97 35 84 37 53 32 Z"/>'+
    '<path d="M47 34 C24 30 12 35 11 41 C10 46 22 46 47 38 Z"/>'+
    '<path d="M53 34 C76 30 88 35 89 41 C90 46 78 46 53 38 Z"/>'+
  '</g>'+
  '<ellipse cx="50" cy="20" rx="4.5" ry="5"/>'+
  '<rect x="47.8" y="24" width="4.4" height="34" rx="2.2"/>'+
  '</svg>';

function renderRoulette(){
  const q = DATA.backlog || [];
  let html = '<div class="sheet-bar"><button class="btn ghost" data-act="close">← All months</button></div>'+
    '<h2 class="sheet-month">Next pick</h2>';

  html += '<div class="section-label">The wheel</div>';
  if (q.length < 2){
    html += '<div class="reel"><p class="rt">Need 2+</p><p class="ra">Add some books below first</p></div>';
  } else {
    const hit = rouletteHit!=null ? q[rouletteHit] : null;
    html += '<div class="reel" id="reel">'+DFLY+'<p class="rt" id="reel-title">'+
      (hit?esc(hit.title):'Ready')+'</p><p class="ra" id="reel-author">'+
      (hit?esc([hit.author, hit.addedBy?('suggested by '+member(hit.addedBy).name):''].filter(Boolean).join(' · ')):
        q.length+' books in the pile')+'</p></div>'+
      '<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem">'+
      '<button class="btn gold" data-act="spin">'+(rouletteHit!=null?'Spin again':'Spin')+'</button>'+
      (rouletteHit!=null
        ? '<select id="assign-month" style="max-width:200px">'+
          DATA.months.map(m=>'<option value="'+esc(m.id)+'"'+(m.bom?'':' ')+'>'+esc(m.name)+
          (m.bom?' (taken)':'')+'</option>').join('')+'</select>'+
          '<button class="btn primary" data-act="assign">Make it the pick</button>'
        : '')+'</div>';
  }

  html += '<div class="section-label">The pile ('+q.length+')</div>';
  html += '<div class="queue">'+ (q.length ? q.map((b,i)=>
    '<div class="qrow'+(rouletteHit===i?' hot':'')+'" style="--qc:'+(b.addedBy?readerColor(b.addedBy):'var(--fg-dim)')+'">'+
    '<span class="qt">'+esc(b.title)+(b.author?' <span class="qa">'+esc(b.author)+'</span>':'')+'</span>'+
    (b.addedBy?'<span class="qw">'+esc(member(b.addedBy).name)+'</span>':'')+
    '<button class="btn ghost" data-delq="'+i+'">×</button></div>').join('')
    : '<p class="empty-note">Nothing in the pile yet.</p>') +'</div>';

  html += '<div class="edit-block"><div class="edit-block-head"><h4>Add to the pile</h4></div>'+
    '<div class="row">'+
    '<label class="field"><span>Title</span><input type="text" id="q-title" placeholder="Book title"></label>'+
    '<label class="field"><span>Author</span><input type="text" id="q-author" placeholder="Optional"></label>'+
    '<label class="field"><span>Suggested by</span><select id="q-who">'+
      '<option value="">Nobody in particular</option>'+
      DATA.members.map(x=>'<option value="'+esc(x.id)+'"'+(me===x.id?' selected':'')+'>'+
        esc(memberLabel(x.id))+'</option>').join('')+
    '</select></label></div>'+
    '<button class="btn" data-act="addq">Add it</button></div>';

  $('#sheet-inner').innerHTML = html;
  wireRoulette();
  $('#sheet').scrollTop = 0;
}

function wireRoulette(){
  const root = $('#sheet-inner');
  root.querySelectorAll('[data-act]').forEach(btn=>btn.addEventListener('click',()=>{
    const act = btn.dataset.act;
    if (act==='close') return closeSheet();
    if (act==='addq'){
      const t = $('#q-title').value.trim();
      if (!t) return toast('Give it a title');
      DATA.backlog.push({ title:t, author:$('#q-author').value.trim(),
        addedBy:$('#q-who').value || '' , cover:'' });
      rouletteHit = null; queueSave(); renderRoulette(); toast('Added to the pile');
    }
    if (act==='spin') spin();
    if (act==='assign'){
      const monthId = $('#assign-month').value;
      const m = DATA.months.find(x=>x.id===monthId);
      const b = DATA.backlog[rouletteHit];
      if (!m || !b) return;
      m.bom = { title:b.title, author:b.author||'', goodreads:null, cover:b.cover||'',
        pages:null, genres:[], pickedBy: b.addedBy||'', scores:{},
        quotes:Object.fromEntries(DATA.members.map(x=>[x.id,[]])) };
      DATA.backlog.splice(rouletteHit,1);
      rouletteHit = null;
      queueSave(); render(); renderRoulette();
      toast(b.title+' is now '+m.name+"'s pick");
      enrichBooks();
    }
  }));
  root.querySelectorAll('[data-delq]').forEach(btn=>btn.addEventListener('click',()=>{
    DATA.backlog.splice(Number(btn.dataset.delq),1);
    rouletteHit = null; queueSave(); renderRoulette();
  }));
}

function spin(){
  const q = DATA.backlog||[];
  if (q.length<2 || spinning) return;
  const target = Math.floor(Math.random()*q.length);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce){ rouletteHit = target; renderRoulette(); return; }

  spinning = true;
  const reel = $('#reel'), t = $('#reel-title'), a = $('#reel-author'), d = $('#dfly');
  reel.classList.add('spinning');
  a.textContent = 'spinning…';
  const dart = () => {
    if (!d) return;
    const x = (Math.random()*2-1) * (reel.clientWidth/2 - 60);
    const y = Math.random()*22 - 4;
    const r = (Math.random()*2-1) * 16;
    d.style.transform = 'translate('+x.toFixed(0)+'px,'+y.toFixed(0)+'px) rotate('+r.toFixed(0)+'deg)';
  };
  let i = 0, delay = 55;
  const tick = () => {
    t.textContent = q[i % q.length].title;
    dart();
    i++;
    delay = delay * 1.13;
    if (delay < 340){ setTimeout(tick, delay); }
    else {
      spinning = false;
      rouletteHit = target;
      reel.classList.remove('spinning');
      if (d) d.style.transform = 'translate(0,0) rotate(0deg)';
      setTimeout(renderRoulette, 480);
    }
  };
  tick();
}

/* ================= shared sheet wiring ================= */
function wireSimpleSheet(){
  $('#sheet-inner').querySelectorAll('[data-act]').forEach(btn=>btn.addEventListener('click',()=>{
    if (btn.dataset.act==='close') return closeSheet();
    if (btn.dataset.act==='enrich') enrichBooks({announce:true});
  }));
}

$('#scrim').addEventListener('click',()=>{ closeSheet(); closePanel(); });
document.addEventListener('keydown',e=>{
  if (e.key!=='Escape') return;
  if ($('#panel').classList.contains('open')) return closePanel();
  if (view) closeSheet();
});

/* ================= theme ================= */
function applyTheme(){
  Object.entries((DATA&&DATA.theme)||{}).forEach(([k,v])=>document.documentElement.style.setProperty(k,v));
}
function buildPanel(){
  if ($('#presets').dataset.built) return;
  $('#presets').dataset.built = '1';
  $('#presets').innerHTML = Object.entries(PRESETS).map(([n,t])=>
    '<button class="preset" data-preset="'+esc(n)+'"><span class="swatches">'+
    '<i style="background:'+t['--bg']+'"></i><i style="background:'+t['--card']+'"></i>'+
    '<i style="background:'+t['--accent']+'"></i><i style="background:'+t['--gold']+'"></i>'+
    '</span>'+esc(n)+'</button>').join('');
  $('#presets').querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{
    DATA.theme = Object.assign({}, PRESETS[b.dataset.preset]);
    applyTheme(); syncPanelInputs(); render(); if(view) renderSheet(); queueSave();
  }));
  $('#color-rows').innerHTML = THEME_KEYS.map(([k,l])=>
    '<div class="color-row"><label for="c'+k+'">'+esc(l)+'</label>'+
    '<input type="color" id="c'+k+'" data-var="'+k+'"></div>').join('');
  $('#color-rows').querySelectorAll('input[type=color]').forEach(inp=>{
    inp.addEventListener('input',()=>{
      DATA.theme[inp.dataset.var]=inp.value;
      applyTheme(); render(); if(view) renderSheet();
    });
    inp.addEventListener('change', queueSave);
  });
  $('#radius').addEventListener('input',e=>{ DATA.theme['--radius']=e.target.value+'px'; applyTheme(); });
  $('#radius').addEventListener('change', queueSave);
}
function syncPanelInputs(){
  if (!DATA) return;
  THEME_KEYS.forEach(([k])=>{
    const i=$('#color-rows input[data-var="'+k+'"]');
    if (i && DATA.theme[k]) i.value=DATA.theme[k];
  });
  $('#radius').value = parseInt(DATA.theme['--radius']||'2',10);
}
function closePanel(){
  $('#panel').classList.remove('open');
  if(!view) $('#scrim').classList.remove('open');
}
$('#btn-settings').addEventListener('click',()=>{
  $('#panel').classList.add('open'); $('#scrim').classList.add('open'); $('#panel-close').focus();
});
$('#panel-close').addEventListener('click', closePanel);

/* ================= toolbar ================= */
$('#btn-wrapped').addEventListener('click',()=>openSheet('wrapped'));
$('#btn-roulette').addEventListener('click',()=>openSheet('roulette'));
$('#btn-covers').addEventListener('click',()=>enrichBooks({announce:true}));
$('#yr-prev').addEventListener('click',()=>loadYear(YEAR-1));
$('#yr-next').addEventListener('click',()=>loadYear(YEAR+1));

$('#btn-export').addEventListener('click',()=>{
  const blob = new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='bookclub-'+YEAR+'-backup.json'; a.click();
  URL.revokeObjectURL(a.href); toast('Backup downloaded');
});
$('#btn-import').addEventListener('click',()=>$('#file-input').click());
$('#file-input').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const next=JSON.parse(r.result);
      if(!next.months) throw new Error('bad file');
      DATA = migrate(next);
      applyTheme(); syncPanelInputs(); render(); queueSave(); toast('Backup restored');
    }catch(err){ toast("That file isn't book club JSON"); }
  };
  r.readAsText(f); e.target.value='';
});

/* ================= boot ================= */
(function boot(){
  document.documentElement.style.setProperty('--bg', PRESETS.Lacquer['--bg']);
  initSync();
  setInterval(()=>{ if(DATA) paintLastEdit(); }, 60000);
})();
